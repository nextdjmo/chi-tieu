const fabTop = document.getElementById('fabTop');
function updateFabTop(){
  if(window.scrollY > 320) fabTop.classList.add('show');
  else fabTop.classList.remove('show');
}
window.addEventListener('scroll', updateFabTop, {passive:true});
fabTop.addEventListener('click', ()=>{
  window.scrollTo({top:0, behavior:'smooth'});
});
updateFabTop();

document.getElementById('fabAdd').addEventListener('click', ()=>openQuickAdd());
document.getElementById('quickAddClose').addEventListener('click', closeQuickAdd);
document.getElementById('quickAddOverlay').addEventListener('click', e=>{
  if(e.target.id==='quickAddOverlay') closeQuickAdd();
});
document.getElementById('quickAddForm').addEventListener('submit', e=>{
  e.preventDefault();
  const data = {
    ngay: document.getElementById('qaNgay').value || todayStr(),
    chiTiet: document.getElementById('qaChiTiet').value.trim(),
    soTien: parseMoney(document.getElementById('qaSoTien').value),
    loai: document.getElementById('qaLoai').value,
  };
  if(!data.chiTiet || !data.soTien) return;

  if(editingCtId){
    const row = state.ct.find(r=>r.id===editingCtId);
    if(row) Object.assign(row, data);
  } else {
    state.ct.push({ id: uid(), ...data });
    // Khoản mới nằm ngoài tháng đang xem thì nhảy sang tháng đó luôn, nếu không
    // người dùng sẽ tưởng là ghi hụt vì không thấy nó đâu cả.
    const d = parseDate(data.ngay);
    if(d && state.ui.currentTab==='ct' && state.ui.ctMode!=='all'){
      const vT = state.ui.ctViewThang ?? state.meta.thang;
      const vN = state.ui.ctViewNam   ?? state.meta.nam;
      if(d.getMonth()+1 !== vT || d.getFullYear() !== vN){
        state.ui.ctViewThang = d.getMonth()+1;
        state.ui.ctViewNam   = d.getFullYear();
      }
    }
    // Ngày vừa ghi luôn được mở sẵn để thấy ngay khoản mình vừa nhập
    const i = state.ui.ctCollapsedDays.indexOf(data.ngay);
    if(i >= 0) state.ui.ctCollapsedDays.splice(i,1);
  }
  saveState();
  closeQuickAdd();
  renderAll();
});

document.getElementById('quickAddDelete').addEventListener('click', ()=>{
  if(!editingCtId) return;
  if(!confirm('Xoá khoản chi này?')) return;
  state.ct = state.ct.filter(r=>r.id!==editingCtId);
  saveState();
  closeQuickAdd();
  renderAll({keepScroll:true});
});

/* ==========================================================
   ĐIỀU HƯỚNG THÁNG (dùng chung cho Tổng quan + Chi tiêu)
   ----------------------------------------------------------
   Trước đây đoạn này bị chép tay 6 lần, mỗi tab một bản → chỉ cần sửa một chỗ là lệch.
   Nay gom về một hàm duy nhất, kèm CHỐT CHẶN CHỐNG NHẬN 2 LẦN CHẠM.
   ========================================================== */
let lastMonthNavAt = 0;
function navMonth(scope, delta, backToToday){
  // Cùng một cú chạm mà trình duyệt bắn 2 sự kiện click liên tiếp (hoặc ngón tay nảy
  // nhẹ trên màn hình kính) sẽ làm tháng lùi/tiến 2 bước. 250ms đủ để loại bỏ cú chạm
  // thừa nhưng vẫn cho phép bấm liên tục khi người dùng thật sự muốn đi nhiều tháng.
  const now = Date.now();
  if(now - lastMonthNavAt < 250) return;
  lastMonthNavAt = now;

  const kThang = scope+'ViewThang', kNam = scope+'ViewNam';
  if(backToToday){
    state.ui[kThang] = null; state.ui[kNam] = null;
  } else {
    const viewThang = state.ui[kThang] ?? state.meta.thang;
    const viewNam   = state.ui[kNam]   ?? state.meta.nam;
    const m = addMonths(viewThang, viewNam, delta);
    state.ui[kThang] = m.thang; state.ui[kNam] = m.nam;
  }
  saveState();
  renderAll({keepScroll:true});   // giữ nguyên chỗ đang đọc, không nhảy về đầu trang
}
/* Chọn thẳng một tháng bất kỳ từ bộ chọn tháng gốc của iOS */
function pickMonth(scope, value){
  const m = /^(\d{4})-(\d{2})$/.exec(value || '');
  if(!m) return;
  state.ui[scope+'ViewThang'] = parseInt(m[2],10);
  state.ui[scope+'ViewNam']   = parseInt(m[1],10);
  saveState();
  renderAll({keepScroll:true});
}

/* ==========================================================
   EVENT DELEGATION
   ========================================================== */
document.addEventListener('click', e=>{
  // Sửa lỗi trên iOS: khi đang gõ dở một ô input/select rồi chạm thẳng vào nút khác
  // (VD: đổi tab), Safari/Chrome trên iPhone đôi khi KHÔNG kịp bắn sự kiện 'change'
  // của ô đang focus trước khi xử lý cú chạm đó — khiến giá trị vừa sửa (ví dụ ở
  // tab Ngân sách) không được lưu vào state, và bị "quay lại số cũ" khi renderAll().
  // Chủ động gọi blur() ngay từ đầu để buộc 'change' chạy đồng bộ trước, đảm bảo
  // giá trị luôn được lưu trước khi các thao tác khác (chuyển tab, xoá dòng...) chạy.
  const activeEl = document.activeElement;
  if(activeEl && activeEl !== e.target && activeEl.matches &&
     activeEl.matches('input, select, textarea') && !activeEl.contains(e.target)){
    activeEl.blur();
  }

  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ state.ui.currentTab = tabBtn.dataset.tab; saveState(); renderAll(); window.scrollTo({top:0}); return; }

  const toggleBtn = e.target.closest('[data-toggle-add]');
  if(toggleBtn){
    const key = toggleBtn.dataset.toggleAdd;
    addOpen[key] = !addOpen[key];
    const wrap = document.querySelector(`[data-add-wrap="${key}"]`);
    if(wrap){
      wrap.classList.toggle('open', addOpen[key]);
      toggleBtn.classList.toggle('open', addOpen[key]);
      if(addOpen[key]){
        const firstField = wrap.querySelector('input, select');
        if(firstField) setTimeout(()=>firstField.focus(), 180);
      }
    }
    return;
  }

  const delBtn = e.target.closest('[data-action="delete"]');
  if(delBtn){
    const arrName = delBtn.dataset.array, id = delBtn.dataset.id;
    if(confirm('Xoá dòng này?')){
      state[arrName] = state[arrName].filter(r=>r.id!==id);
      saveState(); renderAll();
    }
    return;
  }

  // ---------- Chuyển chế độ xem ở tab Chi tiêu ----------
  const segBtn = e.target.closest('[data-ctmode]');
  if(segBtn){
    state.ui.ctMode = segBtn.dataset.ctmode;
    saveState(); renderAll(); window.scrollTo({top:0}); return;
  }

  // ---------- Mở/đóng một ngày ----------
  const dayBtn = e.target.closest('[data-day-toggle]');
  if(dayBtn){
    const ngay = dayBtn.dataset.dayToggle;
    const card = dayBtn.closest('.day-card');
    const list = state.ui.ctCollapsedDays;
    const i = list.indexOf(ngay);
    if(i >= 0) list.splice(i,1); else list.push(ngay);
    saveState();
    // Chỉ bật/tắt class ngay tại chỗ — không vẽ lại cả trang nên không giật, không mất
    // vị trí cuộn, và phản hồi tức thì dù danh sách dài.
    if(card){
      const open = i >= 0;
      card.classList.toggle('open', open);
      dayBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    return;
  }
  if(e.target.id==='ctExpandAll'){ state.ui.ctCollapsedDays = []; saveState(); renderAll({keepScroll:true}); return; }
  if(e.target.id==='ctCollapseAll'){
    state.ui.ctCollapsedDays = [...new Set(state.ct.map(r=>r.ngay).filter(Boolean))];
    saveState(); renderAll({keepScroll:true}); return;
  }

  // ---------- Chạm vào một khoản chi để sửa / xoá ----------
  const editBtn = e.target.closest('[data-edit-ct]');
  if(editBtn){ openQuickAdd(editBtn.dataset.editCt); return; }

  // ---------- Chạm vào cột trong biểu đồ xu hướng để nhảy tới tháng đó ----------
  const jumpEl = e.target.closest('[data-jump]');
  if(jumpEl){
    const [t,n] = jumpEl.getAttribute('data-jump').split('-').map(Number);
    state.ui.ctViewThang = t; state.ui.ctViewNam = n;
    saveState(); renderAll({keepScroll:true}); return;
  }

  // ---------- Điều hướng tháng (dùng chung Tổng quan + Chi tiêu) ----------
  for(const scope of ['tccn','ct']){
    if(e.target.closest('#'+scope+'PrevMonth'))  return navMonth(scope, -1);
    if(e.target.closest('#'+scope+'NextMonth'))  return navMonth(scope, +1);
    if(e.target.closest('#'+scope+'TodayMonth')) return navMonth(scope, 0, true);
  }

  if(e.target.id==='btnExport'){
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const dd = now.getDate();
    const mm = now.getMonth()+1;
    const yyyy = now.getFullYear();
    const hh = String(now.getHours()).padStart(2,'0');
    const mi = String(now.getMinutes()).padStart(2,'0');
    // Lưu ý: trình duyệt sẽ tự đổi "/" và ":" thành "_" khi lưu file (ký tự này không hợp lệ trong tên file).
    const fileName = `DATATC-${dd}/${mm}/${yyyy} ${hh}:${mi}.json`;
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return;
  }

  if(e.target.id==='btnReset'){
    if(confirm('Xoá TOÀN BỘ dữ liệu? Hành động này không thể hoàn tác.')){
      state = defaultState();
      saveState(); renderAll();
    }
    return;
  }
});

/* Định dạng số tiền có dấu phẩy ngay khi đang gõ (mọi ô có data-type="money")
   Giữ đúng vị trí con trỏ theo số chữ số đã gõ trước đó, thay vì luôn đẩy về cuối —
   đây chính là nguyên nhân khiến việc sửa một số tiền có sẵn (VD: Ngân sách) rất khó
   thực hiện trước đây (mỗi lần gõ, con trỏ bị bật ngược về cuối ô). */
document.addEventListener('input', e=>{
  const el = e.target;
  if(el.matches && el.matches('[data-type="money"]')){
    const raw = el.value;
    const caret = el.selectionStart == null ? raw.length : el.selectionStart;
    const digitsBeforeCaret = raw.slice(0, caret).replace(/[^0-9]/g,'').length;
    const digits = raw.replace(/[^0-9]/g,'');
    const num = digits ? parseInt(digits,10) : 0;
    const formatted = digits ? formatNumberPlain(num) : '';
    el.value = formatted;
    let pos = 0, seen = 0;
    while(pos < formatted.length && seen < digitsBeforeCaret){
      if(/[0-9]/.test(formatted[pos])) seen++;
      pos++;
    }
    el.setSelectionRange(pos, pos);
  }

  // Cập nhật NGAY các cột tính toán (Tổng/Còn lại/Trạng thái ở Ngân sách...) trong lúc
  // đang gõ, không chờ rời khỏi ô (blur/change) mới "nhảy" số như trước. Chỉ patch trực
  // tiếp các ô liên quan bằng DOM (không renderAll() toàn trang) để không làm mất con trỏ/
  // bàn phím đang gõ dở.
  if(el.dataset && el.dataset.array){
    liveUpdateComputedCells(el);
  }
});

/* Ghi giá trị đang gõ vào state ngay lập tức (không cần đợi blur) rồi tính lại + patch
   các ô hiển thị phụ thuộc (hiện chỉ áp dụng cho bảng Ngân sách — donGia/soBuoiCoDinh
   ảnh hưởng tới Tổng/Còn lại/Trạng thái của chính dòng đó và các ô tổng hợp cuối bảng). */
function liveUpdateComputedCells(el){
  const arrName = el.dataset.array, id = el.dataset.id, field = el.dataset.field, type = el.dataset.type || 'text';
  const row = state[arrName] && state[arrName].find(r=>r.id===id);
  if(!row) return;

  let val;
  if(type==='money'){ val = parseMoney(el.value); }
  else if(type==='number'){ val = parseInt(String(el.value).replace(/[^0-9-]/g,''),10) || 0; }
  else { val = el.value; }
  row[field] = val;
  saveState();

  if(arrName!=='bb') return; // hiện chỉ Ngân sách có cột tính toán phụ thuộc trực tiếp

  const rows = computeBBRows();
  const r = rows.find(x=>x.id===id);
  if(!r) return;
  const tr = el.closest('tr');
  if(tr){
    const tongCell = tr.querySelector('td[data-label="Tổng"]');
    if(tongCell) tongCell.textContent = fmt(r.tong);
    const daChiCell = tr.querySelector('td[data-label="Đã chi tháng này"]');
    if(daChiCell) daChiCell.textContent = fmt(r.daChi);
    const conLaiCell = tr.querySelector('td[data-label="Còn lại"]');
    if(conLaiCell) conLaiCell.textContent = fmt(r.conLai);
    const trangThaiCell = tr.querySelector('td[data-label="Trạng thái"] .pill');
    if(trangThaiCell){
      trangThaiCell.textContent = r.conLai>=0 ? 'OK' : 'Vượt';
      trangThaiCell.classList.toggle('ok', r.conLai>=0);
      trangThaiCell.classList.toggle('warn', r.conLai<0);
    }
  }

  const sum = computeBBSummary(rows);
  const setSum = (id, text)=>{ const e2 = document.getElementById(id); if(e2) e2.textContent = text; };
  setSum('bbSumDaDung', fmt(sum.soTienDaDung));
  setSum('bbSumTrongThangCan', fmt(sum.soTienTrongThangCan));
  setSum('bbSumThucTeCanSuDung', fmt(sum.soTienThucTeCanSuDung));
  const vuotEl = document.getElementById('bbSumVuotQua');
  if(vuotEl){ vuotEl.textContent = fmt(sum.vuotQua); vuotEl.style.color = sum.vuotQua>0 ? '#EF4444' : 'inherit'; }
  setSum('bbSumCan', fmt(sum.soTienCan));
}

/* Bấm vào ô tiền là chọn hết nội dung sẵn có, để gõ số mới là thay thế luôn — đỡ phải xoá tay */
document.addEventListener('focusin', e=>{
  const el = e.target;
  if(el.matches && el.matches('[data-type="money"]')){
    setTimeout(()=>{ try{ el.select(); }catch(err){} }, 0);
  }
});

document.addEventListener('change', e=>{
  const el = e.target;

  // Chọn tháng trực tiếp bằng bộ chọn tháng gốc của iOS
  if(el.id==='ctMonthPick'){ pickMonth('ct', el.value); return; }
  if(el.id==='tccnMonthPick'){ pickMonth('tccn', el.value); return; }

  // Xem dư nợ tháng khác
  if(el.id==='duNoThangInput' || el.id==='duNoNamInput'){
    const t = document.getElementById('duNoThangInput');
    const n = document.getElementById('duNoNamInput');
    state.ui.duNoThangKhac = parseInt(t.value,10) || state.meta.thang;
    state.ui.duNoNamKhac = parseInt(n.value,10) || state.meta.nam;
    saveState(); renderAll(); return;
  }

  // Import file
  if(el.id==='fileImport'){
    const file = el.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = evt=>{
      try{
        const parsed = JSON.parse(evt.target.result);
        if(!parsed || typeof parsed!=='object' || !parsed.meta){
          alert('File JSON không đúng định dạng của Sổ Chi Tiêu.');
          return;
        }
        if(confirm('Khôi phục sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại. Tiếp tục?')){
          state = migrateUI(parsed);
          saveState(); renderAll();
        }
      }catch(err){
        alert('Không đọc được file JSON: '+err.message);
      }
    };
    reader.readAsText(file);
    return;
  }

  // Meta fields (Tổng quan settings)
  if(el.dataset && el.dataset.meta){
    const field = el.dataset.meta, type = el.dataset.type || 'text';
    let val;
    if(type==='money'){ val = parseMoney(el.value); el.value = formatNumberPlain(val); }
    else if(type==='number'){ val = parseInt(el.value,10) || 0; }
    else { val = el.value; }
    state.meta[field] = val;
    saveState(); renderAll(); return;
  }

  // Table cell edits
  if(el.dataset && el.dataset.array){
    const arrName = el.dataset.array, id = el.dataset.id, field = el.dataset.field, type = el.dataset.type || 'text';
    const row = state[arrName].find(r=>r.id===id);
    if(!row) return;
    let val;
    if(type==='money'){ val = parseMoney(el.value); }
    else if(type==='number'){ val = parseInt(String(el.value).replace(/[^0-9-]/g,''),10) || 0; }
    else if(type==='checkbox'){ val = el.checked; }
    else { val = el.value; }
    row[field] = val;
    saveState(); renderAll(); return;
  }
});

document.addEventListener('submit', e=>{
  const form = e.target.closest('form[data-add]');
  if(!form) return;
  e.preventDefault();
  const arrName = form.dataset.add;
  const fd = new FormData(form);
  const obj = { id: uid() };
  for(const [k,v] of fd.entries()) obj[k] = v;
  normalizeNewRow(arrName, obj);
  state[arrName].push(obj);
  saveState();
  addOpen[arrName] = false;
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ==========================================================
   INIT
   ========================================================== */
renderAll();
</script>

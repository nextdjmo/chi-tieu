<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: cho phép dùng env(safe-area-inset-*) để né Dynamic Island + thanh Home
     của iPhone 16 Plus. Đã BỎ maximum-scale=1.0 vì iOS 10+ cố tình phớt lờ nó (lý do trợ năng),
     giữ lại chỉ làm hỏng khả năng phóng to của người dùng mà không được lợi gì. Việc chống
     "tự zoom khi bấm vào ô nhập" được xử lý đúng cách bằng font-size:16px cho mọi input. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4338CA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Sổ Chi Tiêu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F7FC;
    --paper-2:#EAEFFA;
    --panel:#FFFFFF;
    --ink:#1E2A3C;
    --ink-soft:#5B6B84;
    --ink-faint:#9AA6BA;
    --brass:#4F46E5;
    --brass-soft:#E4E1FC;
    --jade:#0EA968;
    --jade-bg:#DFF7EA;
    --rust:#EF4444;
    --rust-bg:#FDE7E6;
    --line:#E1E6F0;
    --line-soft:#EDF1F9;
    --white:#FFFFFF;
    --header-grad:linear-gradient(120deg,#4338CA 0%,#0EA5E9 100%);
    --accent-2:#FBBF24;

    /* one consistent control size for every input/select/button in the app */
    --ctrl-h:42px;
    --r-sm:9px;      /* inputs, buttons, chips */
    --r-md:13px;     /* panels, cards, sheets */
    --r-lg:18px;     /* bottom sheet */
    --gap:10px;
    --shadow:0 1px 2px rgba(30,42,60,.05), 0 3px 12px rgba(30,42,60,.06);

    /* Safe-area của iPhone (Dynamic Island / thanh Home). Trên máy không có notch = 0px. */
    --sa-top:env(safe-area-inset-top, 0px);
    --sa-bottom:env(safe-area-inset-bottom, 0px);
    --sa-left:env(safe-area-inset-left, 0px);
    --sa-right:env(safe-area-inset-right, 0px);

    /* Bảng màu cho biểu đồ theo hạng mục */
    --c1:#4F46E5; --c2:#0EA5E9; --c3:#0EA968; --c4:#F59E0B;
    --c5:#EF4444; --c6:#8B5CF6; --c7:#EC4899; --c8:#14B8A6;
    --c9:#F97316; --c10:#64748B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:13px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overscroll-behavior-y:none;          /* chặn "kéo quá đà" làm reload trang trên iOS */
    -webkit-text-size-adjust:100%;       /* Safari không tự phóng chữ khi xoay ngang */
  }

  /* ==========================================================
     SỬA LỖI GỐC: NHẢY 2 THÁNG KHI BẤM MŨI TÊN (9 → 7)
     ----------------------------------------------------------
     Safari iOS mặc định chờ ~300ms sau mỗi lần chạm để xem người dùng có "chạm đúp
     để phóng to" hay không. Trong 300ms đó nút trông như chết → người dùng theo phản
     xạ chạm thêm phát nữa → 2 sự kiện click cùng bắn ra → tháng lùi 2 bước (9→8→7),
     mà màn hình vẽ lại quá nhanh nên chỉ kịp thấy kết quả cuối là tháng 7.
     touch-action:manipulation tắt hẳn cơ chế chạm-đúp-phóng-to ⇒ nút phản hồi tức thì,
     không còn 300ms trễ, không còn cú chạm thừa.
     ========================================================== */
  button, a, label, summary, input, select, textarea, [role="button"], .tab-btn{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  button{ -webkit-user-select:none; user-select:none; }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .money{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; white-space:nowrap;}
  a{color:inherit;}
  input, select, button{font:inherit;}

  /* ---------- Header ---------- */
  header.masthead{
    background:var(--header-grad);
    color:#FFFFFF;
    padding:calc(16px + var(--sa-top)) calc(18px + var(--sa-right)) 16px calc(18px + var(--sa-left));
    border-bottom:none;
  }
  .masthead-inner{
    max-width:1080px; margin:0 auto;
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:4px 14px;
  }
  .masthead-title{
    font-family:'Fraunces',serif; font-style:italic; font-weight:600;
    font-size:21px; letter-spacing:.2px;
  }
  .masthead-title span{color:var(--accent-2);}
  .masthead-meta{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:rgba(255,255,255,.78);
    display:flex; gap:6px 14px; flex-wrap:wrap;
  }
  .masthead-meta b{color:#FFFFFF; font-weight:600;}

  /* ---------- Nav tabs ---------- */
  nav.tabs{
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    box-shadow:var(--shadow);
    padding-left:var(--sa-left); padding-right:var(--sa-right);
  }
  .tabs-inner{
    max-width:1080px; margin:0 auto;
    display:flex; overflow-x:auto; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
  }
  .tabs-inner::-webkit-scrollbar{display:none;}
  .tab-btn{
    appearance:none; border:none; background:transparent; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    color:var(--ink-soft); padding:13px 15px; white-space:nowrap;
    min-height:46px;                     /* ≥44px: chuẩn vùng chạm của Apple HIG */
    border-bottom:2.5px solid transparent;
    transition:color .15s, border-color .15s, background .15s;
    flex-shrink:0;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--brass);}

  /* ---------- Add-panel (collapsible "thêm mới" form) ---------- */
  .add-panel{padding:14px 16px;}
  .add-panel-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .add-panel-head h3{margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--ink-soft); flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .btn-toggle-add{
    appearance:none; border:none; background:var(--brass); color:var(--white);
    width:30px; height:30px; border-radius:50%; cursor:pointer; flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center;
    transition:background .15s, transform .15s;
  }
  .btn-toggle-add:hover{background:#3D33C9;}
  .btn-toggle-add:active{transform:scale(.94);}
  .btn-toggle-add .toggle-icon{display:inline-block; font-size:16px; font-weight:600; line-height:1; transition:transform .2s;}
  .btn-toggle-add.open .toggle-icon{transform:rotate(45deg);}
  .add-form-wrap{overflow:hidden; max-height:0; transition:max-height .2s ease;}
  .add-form-wrap.open{max-height:700px; margin-top:12px;}
  .add-form-wrap .add-form{border-top:none; background:var(--paper-2); border-radius:var(--r-sm);}

  /* ---------- Main ---------- */
  main{
    max-width:1080px; margin:0 auto;
    padding:18px calc(16px + var(--sa-right)) calc(56px + var(--sa-bottom)) calc(16px + var(--sa-left));
  }
  .section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin:0 0 3px;
  }
  .section-sub{color:var(--ink-soft); font-size:13px; margin:0 0 16px; line-height:1.5;}

  .panel{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-md);
    box-shadow:var(--shadow); padding:16px 17px; margin-bottom:16px;
  }
  .panel h3{margin:0 0 5px; font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
  .panel .hint{font-size:13px; color:var(--ink-soft); margin:0 0 14px; line-height:1.55;}

  /* ---------- Cards (dashboard) ---------- */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px; margin-bottom:16px;}
  .card{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-md);
    padding:13px 14px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brass-soft);}
  .card.jade::before{background:var(--jade);}
  .card.rust::before{background:var(--rust);}
  .card.brass::before{background:var(--brass);}
  .card-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; line-height:1.35;}
  .card-value{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2;}
  .card-value.jade{color:var(--jade);}
  .card-value.rust{color:var(--rust);}
  .card-sub{font-size:11px; color:var(--ink-soft); margin-top:4px; line-height:1.3;}

  .banner{
    border-radius:var(--r-sm); padding:12px 14px; font-size:13px; margin-bottom:16px;
    display:flex; gap:9px; align-items:flex-start; border:1px solid; line-height:1.5;
  }
  .banner.warn{background:var(--rust-bg); border-color:#F7B4AF; color:#B42318;}
  .banner.ok{background:var(--jade-bg); border-color:#A9E8C7; color:#08703F;}
  .banner.info{background:var(--paper-2); border-color:var(--line); color:var(--ink-soft);}
  .banner.setup{background:var(--brass-soft); border-color:var(--brass); color:#3730A3;}

  /* ---------- Meta form (Tổng quan settings) ---------- */
  .meta-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;}
  .meta-grid .field-full{grid-column:1 / -1;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field input, .field select{
    width:100%; height:var(--ctrl-h); padding:0 11px; border:1px solid var(--line); border-radius:var(--r-sm);
    background:var(--white); font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink);
    box-sizing:border-box; line-height:normal; -webkit-appearance:none; appearance:none;
  }
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2357624F'/></svg>");
    background-repeat:no-repeat; background-position:right 11px center; padding-right:28px;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(79,70,229,.16);}

  /* ---------- Tables (desktop) ---------- */
  .table-scroll{overflow-x:auto; border:1px solid var(--line-soft); border-radius:var(--r-md); background:var(--panel);}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
  thead th{
    text-align:left; padding:10px 12px; background:var(--paper-2); color:var(--ink-soft);
    font-size:11px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{padding:6px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tbody tr:hover{background:#F4F5EF;}
  tbody tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;}
  td.center, th.center{text-align:center;}

  table input[type=text], table input[type=date], table input[type=number], table select{
    width:100%; min-width:76px; height:36px; box-sizing:border-box; padding:0 8px; border:1px solid transparent; border-radius:7px;
    background:transparent; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink);
  }
  table input:hover, table select:hover{border-color:var(--line);}
  table input:focus, table select:focus{border-color:var(--brass); background:var(--white); outline:none;}
  table input.txt{font-family:'Inter',sans-serif;}
  table input[type=checkbox]{width:18px; height:18px; accent-color:var(--jade); margin:0;}

  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.02em;}
  .pill.ok{background:var(--jade-bg); color:var(--jade);}
  .pill.warn{background:var(--rust-bg); color:var(--rust);}

  .btn-icon{
    appearance:none; border:none; background:transparent; cursor:pointer; color:var(--ink-faint);
    width:30px; height:30px; border-radius:7px; line-height:1; font-size:16px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .btn-icon:hover{color:var(--rust); background:var(--rust-bg);}

  /* ---------- Add-row form ----------
     One consistent flex system for every screen size: narrow fields (ngày/tháng/năm,
     which carry an inline max-width) sit together on one line; every other field
     is flex:1 and wraps onto its own row once space runs out. */
  .add-form{
    display:flex; flex-wrap:wrap; gap:8px; padding:14px; border-top:1px dashed var(--line);
    background:var(--paper-2); border-radius:0 0 var(--r-md) var(--r-md);
  }
  .add-form input, .add-form select{
    height:var(--ctrl-h); box-sizing:border-box; padding:0 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--white);
    font-family:'Inter',sans-serif; font-size:14px; flex:1 1 170px; min-width:130px;
    -webkit-appearance:none; appearance:none; color:var(--ink);
  }
  .add-form input[style]{flex:0 0 auto; min-width:0; text-align:center;} /* ngày/tháng/năm — narrow, grouped */
  .add-form input:focus, .add-form select:focus{outline:none; border-color:var(--brass); background:var(--white); box-shadow:0 0 0 3px rgba(79,70,229,.16);}
  .add-form button{
    appearance:none; border:none; background:var(--brass); color:#FFFFFF; font-weight:600;
    height:var(--ctrl-h); padding:0 18px; border-radius:var(--r-sm); cursor:pointer; font-size:14px; white-space:nowrap;
    flex:1 1 100%; margin-top:2px;
  }
  .add-form button:hover, .add-form button:active{background:#3D33C9;}

  .empty-state{
    padding:24px 18px; text-align:center; color:var(--ink-soft); font-size:13px; line-height:1.55;
  }

  .summary-row{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;
  }
  .summary-chip{
    background:var(--paper-2); border:1px solid var(--line-soft); border-radius:var(--r-sm);
    padding:9px 13px; font-size:12px; color:var(--ink-soft); flex:1 1 150px;
  }
  .summary-chip b{display:block; font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--ink); margin-top:3px; font-weight:600;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
  .toolbar label{font-size:13px; color:var(--ink-soft); display:flex; gap:8px; align-items:center;}
  .toolbar input[type=checkbox]{width:17px; height:17px; accent-color:var(--brass);}

  .btn{
    appearance:none; border:1px solid var(--line); background:var(--white); color:var(--ink);
    height:var(--ctrl-h); padding:0 18px; border-radius:var(--r-sm); font-weight:600; font-size:14px; cursor:pointer;
  }
  .btn:hover{border-color:var(--brass); color:var(--brass);}
  .btn.primary{background:var(--brass); color:#FFFFFF; border-color:var(--brass);}
  .btn.primary:hover{background:#3D33C9; border-color:#3D33C9; color:#FFFFFF;}
  .btn.danger{color:var(--rust); border-color:var(--rust-bg);}
  .btn.danger:hover{background:var(--rust-bg);}

  footer{
    text-align:center; color:var(--ink-faint); font-size:12px; padding:18px 16px 30px; border-top:1px solid var(--line-soft);
    line-height:1.6;
  }

  /* ---------- Floating quick-add button ---------- */
  .fab-add{
    position:fixed; right:calc(18px + var(--sa-right)); bottom:calc(22px + var(--sa-bottom)); z-index:60;
    width:56px; height:56px; border-radius:50%;
    background:var(--header-grad); color:#FFFFFF; border:none;
    font-size:26px; line-height:1; font-weight:500;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(79,70,229,.35), 0 1px 3px rgba(30,42,60,.15);
    cursor:pointer;
  }
  .fab-add:active{opacity:.88;}

  /* ---------- Back-to-top floating button ---------- */
  .fab-top{
    position:fixed; left:calc(16px + var(--sa-left)); bottom:calc(24px + var(--sa-bottom)); z-index:55;
    width:44px; height:44px; border-radius:50%;
    background:rgba(250,250,246,.92); color:var(--ink-faint); border:1px solid var(--line-soft);
    font-size:16px; line-height:1; backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(30,42,60,.12);
    cursor:pointer;
    opacity:0; pointer-events:none; transform:translateY(6px);
    transition:opacity .18s, transform .18s, color .15s, border-color .15s;
  }
  .fab-top.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .fab-top:hover{color:var(--brass); border-color:var(--brass);}
  .fab-top:active{background:var(--paper-2);}

  /* ---------- Quick-add sheet ---------- */
  .quick-add-overlay{
    position:fixed; inset:0; background:rgba(30,42,60,.48); z-index:100;
    display:none; align-items:flex-end; justify-content:center;
  }
  .quick-add-overlay.open{display:flex;}
  .quick-add-sheet{
    background:var(--panel); width:100%; max-width:460px;
    border-radius:var(--r-lg) var(--r-lg) 0 0; box-shadow:0 -4px 22px rgba(30,42,60,.22);
    /* +safe-area: nút Lưu không bị thanh Home của iPhone đè lên */
    padding:6px 18px calc(20px + var(--sa-bottom));
    max-height:88vh; overflow-y:auto; overscroll-behavior:contain;
    animation:sheetUp .22s cubic-bezier(.32,.72,0,1);
  }
  @supports (max-height:88dvh){ .quick-add-sheet{max-height:88dvh;} }
  @keyframes sheetUp{from{transform:translateY(18px); opacity:.5;} to{transform:translateY(0); opacity:1;}}
  .quick-add-grabber{width:36px; height:4px; background:var(--line); border-radius:99px; margin:9px auto 12px;}
  .quick-add-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .quick-add-head h3{margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .quick-add-close{
    appearance:none; border:none; background:var(--paper-2); color:var(--ink-soft);
    width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer;
  }
  .quick-add-field{margin-bottom:11px;}
  .quick-add-field label{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .quick-add-field input, .quick-add-field select{
    width:100%; height:46px; padding:0 13px; border:1px solid var(--line); border-radius:var(--r-sm);
    background:var(--white); font-size:16px; color:var(--ink); font-family:'Inter',sans-serif;
    -webkit-appearance:none; appearance:none;
  }
  .quick-add-field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2357624F'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center; padding-right:30px;
  }
  .quick-add-field input.money{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .quick-add-field input:focus, .quick-add-field select:focus{outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(79,70,229,.16);}
  .quick-add-submit{
    width:100%; height:48px; border:none; border-radius:var(--r-sm); margin-top:2px;
    background:var(--brass); color:#FFFFFF; font-weight:700; font-size:14px; cursor:pointer;
  }
  .quick-add-submit:active{background:#3D33C9;}

  /* ---------- Month navigator ---------- */
  .month-nav{
    display:flex; align-items:center; gap:8px; margin-bottom:12px;
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-md);
    box-shadow:var(--shadow); padding:7px 8px;
  }
  .month-nav-btn{
    appearance:none; border:1px solid var(--line); background:var(--white); color:var(--ink);
    width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    transition:transform .08s ease, background .12s, border-color .12s;
  }
  .month-nav-btn:active{transform:scale(.9); background:var(--brass-soft); border-color:var(--brass);}
  .month-nav-btn[disabled]{opacity:.32; pointer-events:none;}

  /* Nhãn tháng giờ là một NÚT: chạm vào để bật bộ chọn tháng gốc của iOS, khỏi phải
     bấm mũi tên nhiều lần khi muốn nhảy xa. */
  .month-pick{
    flex:1 1 auto; min-width:0; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:44px; border:none; background:transparent; cursor:pointer; padding:0 4px;
  }
  .month-pick-main{
    font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--ink);
    line-height:1.15; white-space:nowrap;
  }
  .month-pick-main::after{content:' ⌄'; font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-faint);}
  .month-pick-sub{font-size:10.5px; font-weight:700; letter-spacing:.03em; margin-top:2px;}
  .month-pick-sub.future{color:#3730A3;}
  .month-pick-sub.past{color:var(--ink-soft);}
  .month-pick-sub.now{color:var(--jade);}
  /* input[type=month] trong suốt phủ lên nhãn → chạm đâu cũng mở bộ chọn tháng của iOS */
  .month-pick input[type=month]{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; border:none; background:transparent; -webkit-appearance:none; appearance:none;
  }
  .month-nav-today{
    appearance:none; border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft);
    min-width:44px; height:44px; padding:0 10px; border-radius:999px; font-size:15px; font-weight:600; cursor:pointer;
    flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
  }
  .month-nav-today:active{background:var(--brass-soft); color:var(--brass);}
  .month-nav-badge{
    font-size:11px; font-weight:700; letter-spacing:.03em; padding:3px 10px; border-radius:999px;
  }
  .month-nav-badge.future{background:var(--brass-soft); color:#3730A3;}
  .month-nav-badge.past{background:var(--paper-2); color:var(--ink-soft);}
  .month-nav-badge.now{background:var(--jade-bg); color:var(--jade);}

  /* ---------- Segmented control (Theo ngày / Biểu đồ / Tất cả) ---------- */
  .seg{
    display:flex; background:var(--paper-2); border-radius:11px; padding:3px; gap:3px; margin-bottom:14px;
    border:1px solid var(--line-soft);
  }
  .seg button{
    appearance:none; border:none; background:transparent; cursor:pointer;
    flex:1 1 0; min-width:0; height:38px; border-radius:9px;
    font-size:13px; font-weight:600; color:var(--ink-soft);
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    transition:background .15s, color .15s, box-shadow .15s;
  }
  .seg button.active{background:var(--white); color:var(--brass); box-shadow:0 1px 3px rgba(30,42,60,.12);}
  .seg button:active{transform:scale(.97);}

  /* ---------- Dải tóm tắt nhanh ---------- */
  .quickstats{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:14px;}
  .qs{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-sm);
    padding:9px 8px; text-align:center; box-shadow:var(--shadow); min-width:0;
  }
  .qs-label{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; line-height:1.25;}
  .qs-value{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; margin-top:4px;
    font-variant-numeric:tabular-nums; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .qs-value.rust{color:var(--rust);} .qs-value.jade{color:var(--jade);} .qs-value.brass{color:var(--brass);}

  /* ---------- XEM THEO TỪNG NGÀY ---------- */
  .day-card{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-md);
    box-shadow:var(--shadow); margin-bottom:9px; overflow:hidden;
  }
  .day-card.is-today{border-color:var(--brass); box-shadow:0 0 0 2px var(--brass-soft), var(--shadow);}
  .day-head{
    display:flex; align-items:center; gap:11px; width:100%;
    padding:11px 13px; background:transparent; border:none; cursor:pointer; text-align:left;
    min-height:56px;
  }
  .day-head:active{background:var(--paper-2);}
  .day-datebox{
    flex:0 0 auto; width:42px; text-align:center; line-height:1;
  }
  /* Các thẻ con bên trong <button> buộc phải là <span> (chuẩn HTML), nên phải ép
     display:block thì margin/chiều cao/cắt chữ mới có tác dụng. */
  .day-dd{display:block; font-family:'Fraunces',serif; font-weight:600; font-size:21px; color:var(--ink);}
  .day-dow{display:block; font-size:9.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:3px;}
  .day-card.is-today .day-dd{color:var(--brass);}
  .day-mid{flex:1 1 auto; min-width:0;}
  .day-count{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .day-meter{display:block; height:6px; border-radius:99px; background:var(--paper-2); overflow:hidden;}
  .day-meter i{display:block; height:100%; border-radius:99px; background:var(--header-grad);}
  .day-right{flex:0 0 auto; display:flex; align-items:center; gap:7px;}
  .day-total{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; white-space:nowrap;}
  .day-chev{color:var(--ink-faint); font-size:11px; transition:transform .2s;}
  .day-card.open .day-chev{transform:rotate(180deg);}
  .day-items{display:none; border-top:1px solid var(--line-soft);}
  .day-card.open .day-items{display:block;}

  .txn{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:11px 13px; border:none; background:transparent; cursor:pointer; text-align:left;
    border-bottom:1px solid var(--line-soft); min-height:52px;
  }
  .txn:last-child{border-bottom:none;}
  .txn:active{background:var(--paper-2);}
  .txn-dot{flex:0 0 auto; width:9px; height:9px; border-radius:50%;}
  .txn-body{flex:1 1 auto; min-width:0;}
  .txn-name{display:block; font-size:13.5px; font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .txn-meta{display:block; font-size:11px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .txn-amt{
    flex:0 0 auto; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px;
    white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .txn-edit{flex:0 0 auto; color:var(--ink-faint); font-size:12px;}

  /* ---------- Biểu đồ ---------- */
  .chart-panel{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-md);
    box-shadow:var(--shadow); padding:15px 14px 13px; margin-bottom:13px;
  }
  .chart-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:3px;}
  .chart-title{font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin:0;}
  .chart-note{font-size:11px; color:var(--ink-soft);}
  .chart-sub{font-size:11.5px; color:var(--ink-soft); margin:0 0 12px; line-height:1.45;}
  /* Để SVG tự co giãn ĐỀU theo chiều rộng. Nếu ép sẵn chiều cao bằng inline style thì
     tỉ lệ khung hình lệch, chữ số ngày trong biểu đồ bị kéo bè ra trông rất xấu trên
     màn hình rộng như iPhone 16 Plus. */
  .chart-svg{display:block; width:100%; height:auto; overflow:visible;}
  .chart-donut{display:block; width:auto; height:156px; margin:2px auto 0;}

  .legend{margin-top:12px; display:flex; flex-direction:column; gap:9px;}
  .legend-row{display:flex; align-items:center; gap:9px;}
  .legend-dot{flex:0 0 auto; width:10px; height:10px; border-radius:3px;}
  .legend-body{flex:1 1 auto; min-width:0;}
  .legend-top{display:flex; justify-content:space-between; gap:8px; font-size:12px; margin-bottom:4px;}
  .legend-name{color:var(--ink); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legend-val{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink); white-space:nowrap;}
  .legend-bar{height:5px; border-radius:99px; background:var(--paper-2); overflow:hidden;}
  .legend-bar i{display:block; height:100%; border-radius:99px;}
  .legend-pct{font-size:10.5px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; flex:0 0 auto; width:38px; text-align:right;}
  .chart-legend-mini{display:flex; flex-wrap:wrap; gap:4px 14px; margin-bottom:10px;}
  .chart-legend-mini .lg-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft);}
  .chart-legend-mini .lg-dot{flex:0 0 auto; width:9px; height:9px; border-radius:3px;}

  .bdg{display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:99px; margin-left:6px;}
  .bdg.over{background:var(--rust-bg); color:var(--rust);}
  .bdg.ok{background:var(--jade-bg); color:var(--jade);}

  /* ---------- Sheet sửa khoản chi ---------- */
  .sheet-actions{display:flex; gap:9px; margin-top:12px;}
  .sheet-actions .btn{flex:1 1 0; height:46px;}

  /* ==========================================================
     MOBILE (primary usage surface for this app)
     ========================================================== */
  @media (max-width: 700px){
    main{padding:14px 12px 84px;}
    .section-title{font-size:16px;}
    .panel{padding:14px 14px;}

    .cards{grid-template-columns:1fr 1fr; gap:8px;}
    .card{padding:11px 12px;}
    .card-value{font-size:16px;}

    /* iOS zoom-on-focus prevention: every form control (table/add-form/field/quick-add)
       already renders at 16px — quick-add-field inputs are 16px at every breakpoint too,
       so this single rule keeps ALL inputs in the app on one shared size on mobile. */
    table input, table select, .add-form input, .add-form select, .field input, .field select{
      font-size:16px;
    }

    /* Tables become compact stacked cards on narrow screens */
    .table-scroll{overflow-x:visible; border:none; background:transparent; box-shadow:none;}
    table{min-width:0; width:100%;}
    thead{display:none;}
    tbody{display:block;}
    tbody tr{
      display:block; background:var(--panel); border:1px solid var(--line-soft);
      border-radius:var(--r-md); box-shadow:var(--shadow); margin-bottom:8px; padding:2px 0;
    }
    tbody tr:hover{background:var(--panel);}
    tbody td{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:8px 13px; border-bottom:1px solid var(--line-soft); text-align:right; min-height:38px;
    }
    tbody tr td:last-child{border-bottom:none;}
    tbody td::before{
      content:attr(data-label); font-size:11px; font-weight:700; color:var(--ink-soft);
      text-transform:uppercase; letter-spacing:.03em; text-align:left; flex:0 0 auto;
    }
    tbody td.empty-state{display:block; text-align:center; padding:20px 16px;}
    tbody td.empty-state::before{content:none;}
    table input, table select{text-align:right; min-width:0; max-width:60%; height:36px;}
    table input.txt{text-align:right;}
    table input[type=checkbox]{width:20px; height:20px; flex:0 0 auto;}

    .add-form{padding:13px 12px;}
    .add-form input, .add-form select{flex:1 1 100%; min-width:0;}
    .add-form input[style]{flex:0 0 auto; min-width:64px;} /* keep ngày/tháng/năm grouped on one line */

    .btn{width:100%;}
    .panel .btn{width:auto;}

    .fab-add{right:calc(16px + var(--sa-right)); bottom:calc(18px + var(--sa-bottom));}
    .fab-top{left:calc(14px + var(--sa-left)); bottom:calc(20px + var(--sa-bottom));}

    /* Vùng chạm ≥44px cho nút xoá trong bảng */
    .btn-icon{width:40px; height:40px; font-size:18px;}
    .quickstats{gap:6px;}
    .qs{padding:8px 5px;}
    .qs-value{font-size:12px;}
  }

  /* ==========================================================
     iPhone 16 Plus (430 × 932 pt) và các máy cỡ tương đương
     ========================================================== */
  @media (max-width: 440px){
    body{font-size:13.5px;}
    main{padding-left:calc(13px + var(--sa-left)); padding-right:calc(13px + var(--sa-right));
         padding-bottom:calc(96px + var(--sa-bottom));}
    .cards{grid-template-columns:1fr 1fr;}
    .qs-label{font-size:9px;}
    .month-pick-main{font-size:16px;}
    .day-dd{font-size:20px;}
    /* Không cho bảng biểu đồ tràn ngang gây trượt trái/phải cả trang */
    .chart-panel{overflow:hidden;}
  }

  /* Rất hẹp (iPhone SE / mini): tóm tắt nhanh xuống 2 hàng cho dễ đọc */
  @media (max-width: 380px){
    .quickstats{grid-template-columns:1fr 1fr;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-title">Sổ <span>Chi Tiêu</span></div>
    <div class="masthead-meta" id="mastheadMeta"></div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" id="tabsInner"></div>
</nav>

<main id="app"></main>

<footer>
  Dữ liệu được lưu trong trình duyệt này (localStorage) — không đồng bộ qua thiết bị khác.
  Hãy tải xuống JSON định kỳ ở tab <b>Dữ liệu</b> để sao lưu.
</footer>

<!-- Nút nổi thêm chi tiêu nhanh -->
<button class="fab-add" id="fabAdd" title="Thêm chi tiêu nhanh" aria-label="Thêm chi tiêu nhanh">+</button>

<!-- Nút về đầu trang -->
<button class="fab-top" id="fabTop" title="Về đầu trang" aria-label="Về đầu trang">↑</button>

<!-- Bảng nhập nhanh -->
<div class="quick-add-overlay" id="quickAddOverlay">
  <div class="quick-add-sheet">
    <div class="quick-add-grabber"></div>
    <div class="quick-add-head">
      <h3 id="quickAddTitle">Thêm chi tiêu nhanh</h3>
      <button class="quick-add-close" id="quickAddClose" aria-label="Đóng">✕</button>
    </div>
    <form id="quickAddForm">
      <div class="quick-add-field">
        <label>Số tiền</label>
        <input type="text" inputmode="numeric" class="money" data-type="money" id="qaSoTien" name="soTien" placeholder="0" autofocus required>
      </div>
      <div class="quick-add-field">
        <label>Chi tiết</label>
        <input type="text" id="qaChiTiet" name="chiTiet" placeholder="VD: Trà đá" required>
      </div>
      <div class="quick-add-field">
        <label>Loại</label>
        <select id="qaLoai" name="loai"></select>
      </div>
      <div class="quick-add-field">
        <label>Ngày</label>
        <input type="date" id="qaNgay" name="ngay" required>
      </div>
      <button type="submit" class="quick-add-submit" id="quickAddSubmit">+ Lưu khoản chi</button>
      <div class="sheet-actions" id="quickAddDeleteWrap" style="display:none">
        <button type="button" class="btn danger" id="quickAddDelete">🗑 Xoá khoản chi này</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ==========================================================
   STATE
   ========================================================== */
const STORAGE_KEY = 'soChiTieu_v1';
const TABS = [
  {id:'tccn', label:'Tổng quan'},
  {id:'ct', label:'Chi tiêu'},
  {id:'bb', label:'Ngân sách'},
  {id:'chovay', label:'Cho vay'},
  {id:'chotra', label:'Chờ thu'},
  {id:'duno', label:'Dư nợ'},
  {id:'vay', label:'Vay'},
  {id:'data', label:'Dữ liệu'},
];
const LOAI_MAC_DINH = [
  {loai:'Ăn sáng', donGia:10000, cheDo:'auto', soBuoiCoDinh:0},
  {loai:'Ăn trưa', donGia:40000, cheDo:'auto', soBuoiCoDinh:0},
  {loai:'Người yêu', donGia:500000, cheDo:'coDinh', soBuoiCoDinh:6},
  {loai:'Đổ xăng', donGia:120000, cheDo:'coDinh', soBuoiCoDinh:4},
  {loai:'Youtube', donGia:105000, cheDo:'coDinh', soBuoiCoDinh:1},
  {loai:'Điện thoại', donGia:160000, cheDo:'coDinh', soBuoiCoDinh:1},
  {loai:'Linh tinh', donGia:300000, cheDo:'coDinh', soBuoiCoDinh:1},
  {loai:'Nhậu', donGia:400000, cheDo:'coDinh', soBuoiCoDinh:3},
];

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }

function defaultState(){
  const now = new Date();
  return {
    meta:{
      thang: now.getMonth()+1,
      nam: now.getFullYear(),
      ghiNhanNgay: todayStr(),
      tpbank: 0,
      tienMat: 0,
    },
    ct: [],
    bb: LOAI_MAC_DINH.map(x=>({id:uid(), ...x})),
    chovay: [],
    chotra: [],
    duno: [],
    vay: [],
    ui: defaultUI(),
  };
}

/* Giá trị mặc định của phần giao diện. Gom về MỘT nơi để lúc nạp dữ liệu cũ hay lúc
   khôi phục từ file JSON đều dùng chung, không còn chỗ quên chỗ nhớ như trước. */
function defaultUI(){
  return {
    currentTab:'tccn',
    ctChiThangNay:true,
    duNoThangKhac:null, duNoNamKhac:null,
    tccnViewThang:null, tccnViewNam:null,
    ctViewThang:null, ctViewNam:null,
    ctMode:'ngay',        // 'ngay' = xem từng ngày | 'chart' = biểu đồ | 'all' = tất cả
    ctCollapsedDays:[],   // những ngày người dùng chủ động thu gọn
  };
}
/* Bổ sung các trường UI còn thiếu vào dữ liệu cũ mà không đụng tới trường đã có */
function migrateUI(obj){
  obj.ui = obj.ui || {};
  const d = defaultUI();
  for(const k in d){ if(obj.ui[k]===undefined) obj.ui[k] = d[k]; }
  if(!Array.isArray(obj.ui.ctCollapsedDays)) obj.ui.ctCollapsedDays = [];
  if(!['ngay','chart','all'].includes(obj.ui.ctMode)) obj.ui.ctMode = 'ngay';
  return obj;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrateUI(JSON.parse(raw));
  }catch(e){ console.warn('Không đọc được dữ liệu cũ, khởi tạo mới.', e); }
  return defaultState();
}

let state = loadState();
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* Trạng thái mở/đóng của các khối "+ Thêm ..." — không cần lưu vào localStorage */
const addOpen = {};
function renderAddToggle(key, label){
  return `
  <div class="panel add-panel">
    <div class="add-panel-head">
      <h3>${esc(label)}</h3>
      <button type="button" class="btn-toggle-add ${addOpen[key]?'open':''}" data-toggle-add="${key}" aria-label="${addOpen[key]?'Đóng':'Mở'} form ${esc(label)}" title="${addOpen[key]?'Đóng':'Thêm mới'}">
        <span class="toggle-icon">+</span>
      </button>
    </div>
    <div class="add-form-wrap ${addOpen[key]?'open':''}" data-add-wrap="${key}">
      ###FORM###
    </div>
  </div>`;
}
function wrapAddForm(key, label, formHtml){
  return renderAddToggle(key, label).replace('###FORM###', formHtml);
}

/* ==========================================================
   HELPERS
   ========================================================== */
function fmt(n){
  n = Math.round(Number(n)||0);
  return new Intl.NumberFormat('en-US').format(n) + ' đ';
}
function formatNumberPlain(n){
  n = Math.round(Number(n)||0);
  return new Intl.NumberFormat('en-US').format(n);
}
function parseMoney(v){
  const n = parseInt(String(v).replace(/[^0-9-]/g,''),10);
  return isNaN(n) ? 0 : n;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function inMonth(dateStr, month, year){
  if(!dateStr) return false;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return false;
  return d.getFullYear()===year && (d.getMonth()+1)===month;
}
function weekdaysRemainingInMonth(year, month){
  const now = new Date();
  const isActualCurrent = (now.getFullYear()===year && (now.getMonth()+1)===month);
  const startDate = isActualCurrent ? new Date(year, month-1, now.getDate()) : new Date(year, month-1, 1);
  const next = addMonths(month, year, 1);
  const endDate = new Date(next.nam, next.thang-1, 11); // chu kỳ tháng kết thúc vào ngày 11 tháng sau
  let count = 0;
  for(let d = new Date(startDate); d <= endDate; d.setDate(d.getDate()+1)){
    const dow = d.getDay();
    if(dow>=1 && dow<=5) count++;
  }
  return count;
}
function daysRemainingInCycle(){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end = cycleEndDate();
  const diffDays = Math.round((end - today) / 86400000);
  return Math.max(0, diffDays + 1); // tính cả hôm nay
}
function cycleEndDate(){
  const now = new Date();
  if(now.getDate() <= 11) return new Date(now.getFullYear(), now.getMonth(), 11);
  const next = addMonths(now.getMonth()+1, now.getFullYear(), 1);
  return new Date(next.nam, next.thang-1, 11);
}
function tenThang(m,y){ return m+'/'+y; }
function isFirstSetup(){
  const m = state.meta;
  return (Number(m.tpbank)||0)===0 && (Number(m.tienMat)||0)===0 &&
    state.ct.length===0 && state.chovay.length===0 && state.chotra.length===0 &&
    state.duno.length===0 && state.vay.length===0;
}
/* Cộng/trừ số tháng vào một cặp (tháng, năm), tự động tràn qua năm khác */
function addMonths(thang, nam, delta){
  let idx = (thang-1) + delta;
  let n = nam + Math.floor(idx/12);
  let t = ((idx%12)+12)%12 + 1;
  return {thang:t, nam:n};
}
/* So sánh 2 cặp (tháng,năm): âm nếu a<b, 0 nếu bằng, dương nếu a>b */
function cmpMonth(t1,n1,t2,n2){
  if(n1!==n2) return n1-n2;
  return t1-t2;
}
/* Liệt kê tuần tự các tháng từ (t1,n1) đến (t2,n2), bao gồm cả 2 đầu — giả định t1/n1 <= t2/n2 */
function monthsBetween(t1,n1,t2,n2){
  const out=[]; let t=t1,n=n1; let guard=0;
  while(cmpMonth(t,n,t2,n2)<=0 && guard<240){
    out.push({thang:t,nam:n});
    const nx = addMonths(t,n,1); t=nx.thang; n=nx.nam; guard++;
  }
  return out;
}

/* ==========================================================
   COMPUTED (mirrors công thức trong Google Sheet)
   ========================================================== */
function computeBBRowsFor(thang, nam){
  return state.bb.map(row=>{
    const matched = state.ct.filter(c=> c.loai===row.loai && inMonth(c.ngay, thang, nam));
    const daChi = matched.reduce((s,c)=> s + (Number(c.soTien)||0), 0);
    const soLanChi = matched.length;
    // Chế độ "khongGioiHan" (không giới hạn): dùng cho các hạng mục không đặt trước số buổi cố
    // định (VD: đi chơi) — nhưng vẫn có một TỔNG NGÂN SÁCH cố định (nhập ở ô "Đơn giá", đóng
    // vai trò tổng tiền cho cả tháng thay vì đơn giá/buổi). Chi vượt tổng này vẫn báo "Vượt"
    // như bình thường, chỉ khác là không nhân với số buổi.
    if(row.cheDo==='khongGioiHan'){
      const tong = Number(row.donGia)||0;
      const conLai = tong - daChi;
      return {...row, soBuoi:null, tong, daChi, soLanChi, conLai};
    }
    const soBuoi = row.cheDo==='auto' ? weekdaysRemainingInMonth(nam, thang) : (Number(row.soBuoiCoDinh)||0);
    const tong = (Number(row.donGia)||0) * soBuoi;
    const conLai = tong - daChi;
    return {...row, soBuoi, tong, daChi, soLanChi, conLai};
  });
}
function computeBBRows(){ return computeBBRowsFor(state.meta.thang, state.meta.nam); }
function computeBBSummary(rows){
  const sumTong = rows.reduce((s,r)=>s+r.tong,0);
  const sumConLai = rows.reduce((s,r)=>s+r.conLai,0);
  const sumDaChi = rows.reduce((s,r)=>s+r.daChi,0);
  const soTienDaDung = sumTong - sumConLai;
  const vuotQua = rows.reduce((s,r)=> s + (r.conLai<0 ? -r.conLai : 0), 0);
  const soTienThucTeCanSuDung = sumTong + vuotQua;
  const soTienCan = sumConLai;
  // "Cần dùng thực tế" cho phần dự phóng: chỉ cộng phần CÒN THIẾU của từng hạng mục (>=0),
  // KHÔNG cho phép hạng mục đã chi vượt (conLai âm) bù trừ ngược lại cho hạng mục khác còn dư.
  // Tiền đã chi vượt là chuyện đã xảy ra rồi (đã trừ thẳng vào số dư thực tế), không phải một
  // khoản "được thưởng" để giảm nhu cầu chi tiêu sắp tới của hạng mục khác.
  const soTienCanThucTe = rows.reduce((s,r)=> s + Math.max(0, r.conLai), 0);
  const soHangMucVuotNgs = rows.filter(r=>r.conLai<0).length;
  return { soTienDaDung, sumDaChi, soTienTrongThangCan: sumTong, soTienThucTeCanSuDung, vuotQua, soTienCan, soTienCanThucTe, soHangMucVuotNgs };
}
function computeChoVayOutstanding(){ return state.chovay.reduce((s,r)=> s + (!r.daThu ? (Number(r.soTien)||0) : 0), 0); }
function computeChoTraOutstanding(){ return state.chotra.reduce((s,r)=> s + (!r.daNhan ? (Number(r.soTien)||0) : 0), 0); }
function computeChoTraReceived(){ return state.chotra.reduce((s,r)=> s + (r.daNhan ? (Number(r.soTien)||0) : 0), 0); }
function computeDuNoThang(thang, nam){
  return state.duno.reduce((s,r)=> s + ((Number(r.thang)===thang && Number(r.nam)===nam && !r.daHoanThanh) ? (Number(r.soTien)||0) : 0), 0);
}
function computeVayOutstanding(){ return state.vay.reduce((s,r)=> s + (!r.daHoanThanh ? (Number(r.soTien)||0) : 0), 0); }
function computeCTAllTime(){ return state.ct.reduce((s,r)=> s + (Number(r.soTien)||0), 0); }
/* Các khoản Dư nợ (trả góp) / Vay đã tick "Đã hoàn thành" — tức tiền đã thực sự rời khỏi
   TPBank/tiền mặt để trả nợ, nên phải trừ vào số dư thực tế. Trước khi tick thì KHÔNG trừ,
   vì đó mới chỉ là nghĩa vụ sắp tới chứ chưa phải tiền đã thực sự chi ra — "Số dư thực tế"
   phản ánh đúng tiền đang cầm trong tay, không phải tài sản ròng sau khi trừ nợ. Nghĩa vụ
   "chưa trả" (cả Dư nợ lẫn Vay) chỉ được tính vào ô "Bù trừ" bên dưới, xem computeTCCNForMonth. */
function computeDuNoPaid(){ return state.duno.reduce((s,r)=> s + (r.daHoanThanh ? (Number(r.soTien)||0) : 0), 0); }
function computeVayPaid(){ return state.vay.reduce((s,r)=> s + (r.daHoanThanh ? (Number(r.soTien)||0) : 0), 0); }

/* Số dư thực tế "hôm nay" — không phụ thuộc tháng đang xem ở Tổng quan */
function computeSoDuHomNay(){
  const {tpbank, tienMat} = state.meta;
  const chovayOutstanding = computeChoVayOutstanding();
  const chotraOutstanding = computeChoTraOutstanding();
  const chotraReceived = computeChoTraReceived();
  const ctAllTime = computeCTAllTime();
  const duNoPaid = computeDuNoPaid();
  const vayOutstanding = computeVayOutstanding();
  const vayPaid = computeVayPaid();
  const soDuHienTai = (Number(tpbank)||0) + (Number(tienMat)||0) - chovayOutstanding - ctAllTime + chotraReceived - duNoPaid - vayPaid;
  const soDuDayDu = soDuHienTai + chotraOutstanding;
  return { chovayOutstanding, chotraOutstanding, chotraReceived, duNoPaid, vayOutstanding, vayPaid, soDuHienTai, soDuDayDu };
}

/* Tính toán Tổng quan cho MỘT tháng bất kỳ đang được xem (viewThang/viewNam),
   có tính luỹ kế từ tháng hiện tại (meta.thang/nam) tới tháng đang xem để dự phóng
   xem cần chuẩn bị bao nhiêu tiền mới đủ trả nợ + chi tiêu tới lúc đó. */
function computeTCCNForMonth(viewThang, viewNam){
  const curThang = state.meta.thang, curNam = state.meta.nam;
  const base = computeSoDuHomNay();
  // Khoản vay CHƯA trả không nằm trong base.soDuDayDu (tiền đó vẫn còn nguyên trong túi,
  // xem computeSoDuHomNay) — nên phải cộng vào "Tổng cần" ở đây, vì "Bù trừ" là dự phóng
  // có đủ tiền trang trải mọi nghĩa vụ (ngân sách + dư nợ đến hạn + khoản vay cần trả
  // ngay) hay không, khác với "Số dư thực tế" là tiền đang thật sự có trong tay.
  const duNoVAY = computeVayOutstanding();

  // Số liệu riêng của tháng đang xem
  const bbRowsXem = computeBBRowsFor(viewThang, viewNam);
  const bbSumXem = computeBBSummary(bbRowsXem);
  const duNoThangXem = computeDuNoThang(viewThang, viewNam);
  // Dùng soTienCanThucTe (không cho hạng mục vượt ngân sách bù trừ ngược cho hạng mục khác).
  // Cộng cả duNoVAY vào đây vì khoản vay không đợi tới tháng nào — luôn "cần trả ngay".
  const tongCanThangXem = bbSumXem.soTienCanThucTe + duNoThangXem + duNoVAY;

  // Luỹ kế từ tháng hiện tại đến tháng đang xem (chỉ có ý nghĩa nếu xem >= tháng hiện tại)
  const isFutureOrCurrent = cmpMonth(viewThang, viewNam, curThang, curNam) >= 0;
  let months = [], cumNganSach = 0, cumDuNo = 0;
  if(isFutureOrCurrent){
    months = monthsBetween(curThang, curNam, viewThang, viewNam);
    months.forEach(m=>{
      const rows = (m.thang===viewThang && m.nam===viewNam) ? bbRowsXem : computeBBRowsFor(m.thang, m.nam);
      const s = computeBBSummary(rows);
      cumNganSach += s.soTienCanThucTe;
      cumDuNo += computeDuNoThang(m.thang, m.nam);
    });
  }
  // duNoVAY chỉ cộng MỘT LẦN (không nhân theo số tháng) vì đây là tổng khoản vay chưa trả
  // tính đến hiện tại, không phải nghĩa vụ lặp lại mỗi tháng như ngân sách/dư nợ trả góp.
  const tongCanLuyKe = cumNganSach + cumDuNo + duNoVAY;
  // Dự kiến số dư còn lại nếu phải tự trang trải toàn bộ ngân sách + nợ đến hạn + khoản vay
  // từ giờ đến hết tháng đang xem. duNoVAY đã nằm sẵn trong tongCanLuyKe ở trên rồi, không
  // trừ thêm lần nữa ở đây kẻo bị trừ trùng.
  const buTruDuKien = base.soDuDayDu - tongCanLuyKe;

  return {
    isFutureOrCurrent, months,
    bbRowsXem, // ← THIẾU TRƯỚC ĐÂY: viewTCCN() có dùng biến này để liệt kê hạng mục vượt
               //   ngân sách, nhưng nó chỉ là biến cục bộ trong hàm này nên không ra tới
               //   nơi dùng → ReferenceError → cả tab Tổng quan TRẮNG TRƠN mỗi khi có
               //   bất kỳ hạng mục nào chi vượt ngân sách.
    bbSumXem, duNoThangXem, tongCanThangXem,
    duNoVAY, cumNganSach, cumDuNo, tongCanLuyKe, buTruDuKien,
    ...base,
  };
}

  const el = document.getElementById('tabsInner');
  el.innerHTML = TABS.map(t=>`<button class="tab-btn ${state.ui.currentTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
}
/* keepScroll: giữ nguyên vị trí cuộn sau khi vẽ lại. Khi bấm mũi tên đổi tháng mà trang
   nhảy vọt về đầu, người dùng tưởng nút không ăn và bấm thêm lần nữa — chính là cách cũ
   làm cho tháng bị lùi 2 bước. */
function renderAll(opts){
  const keepScroll = !!(opts && opts.keepScroll);
  const y = keepScroll ? window.scrollY : 0;
  renderMasthead();
  renderTabs();
  const app = document.getElementById('app');
  switch(state.ui.currentTab){
    case 'tccn': app.innerHTML = viewTCCN(); break;
    case 'ct': app.innerHTML = viewCT(); break;
    case 'bb': app.innerHTML = viewBB(); break;
    case 'chovay': app.innerHTML = viewChoVay(); break;
    case 'chotra': app.innerHTML = viewChoTra(); break;
    case 'duno': app.innerHTML = viewDuNo(); break;
    case 'vay': app.innerHTML = viewVay(); break;
    case 'data': app.innerHTML = viewData(); break;
  }
  if(keepScroll) window.scrollTo(0, y);
}

/* ==========================================================
   HỖ TRỢ: NGÀY THÁNG + MÀU + BIỂU ĐỒ
   ========================================================== */
const DOW_FULL  = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const DOW_SHORT = ['CN','T2','T3','T4','T5','T6','T7'];
const CHART_COLORS = ['#4F46E5','#0EA5E9','#0EA968','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316','#64748B'];

function parseDate(s){ if(!s) return null; const d=new Date(s+'T00:00:00'); return isNaN(d)?null:d; }
function daysInMonth(thang,nam){ return new Date(nam, thang, 0).getDate(); }
function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* Màu ổn định cho từng hạng mục: ưu tiên theo thứ tự trong bảng Ngân sách để màu
   không nhảy lung tung mỗi lần thêm/bớt khoản chi. */
function catColor(loai){
  const i = state.bb.findIndex(b=>b.loai===loai);
  if(i>=0) return CHART_COLORS[i % CHART_COLORS.length];
  let h = 0; const s = String(loai||'');
  for(let k=0;k<s.length;k++) h = (h*31 + s.charCodeAt(k)) >>> 0;
  return CHART_COLORS[h % CHART_COLORS.length];
}
/* Rút gọn số tiền cho nhãn biểu đồ (màn hình hẹp không đủ chỗ ghi đủ số) */
function fmtShort(n){
  n = Math.round(Number(n)||0);
  const a = Math.abs(n);
  if(a >= 1e9) return (n/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'') + ' tỷ';
  if(a >= 1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'') + ' tr';
  if(a >= 1e3) return Math.round(n/1e3) + 'k';
  return String(n);
}
/* Nhãn đầu mỗi thẻ ngày: "Hôm nay" / "Hôm qua" / thứ trong tuần */
function dayHeadInfo(dateStr){
  const d = parseDate(dateStr);
  if(!d) return {dd:'—', dow:'', isToday:false};
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - d)/86400000);
  let dow = DOW_SHORT[d.getDay()];
  if(diff===0) dow = 'HÔM NAY';
  else if(diff===1) dow = 'HÔM QUA';
  return { dd:String(d.getDate()), dow, isToday:diff===0, full:DOW_FULL[d.getDay()], thang:d.getMonth()+1, nam:d.getFullYear() };
}
/* Gom danh sách khoản chi thành từng NGÀY, mới nhất lên trước */
function groupByDay(rows){
  const map = new Map();
  rows.forEach(r=>{
    const k = r.ngay || '';
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  return [...map.entries()]
    .sort((a,b)=> b[0].localeCompare(a[0]))
    .map(([ngay, items])=>({
      ngay,
      items: items.slice().sort((a,b)=> (Number(b.soTien)||0) - (Number(a.soTien)||0)),
      tong: items.reduce((s,x)=> s + (Number(x.soTien)||0), 0),
    }));
}

/* ---------- Biểu đồ 1: chi tiêu từng ngày trong tháng (cột) ---------- */
function chartDaily(rowsOfMonth, viewThang, viewNam){
  const nd = daysInMonth(viewThang, viewNam);
  const totals = new Array(nd).fill(0);
  rowsOfMonth.forEach(r=>{
    const d = parseDate(r.ngay);
    if(d) totals[d.getDate()-1] += Number(r.soTien)||0;
  });
  const sum = totals.reduce((a,b)=>a+b,0);
  if(sum <= 0){
    return `<div class="chart-panel"><h3 class="chart-title">Chi theo từng ngày</h3>
      <p class="chart-sub" style="margin:8px 0 0">Tháng ${viewThang}/${viewNam} chưa có khoản chi nào để vẽ.</p></div>`;
  }
  const max = Math.max(...totals);
  const soNgayCoChi = totals.filter(v=>v>0).length;
  const tbNgayCoChi = sum / soNgayCoChi;
  const maxIdx = totals.indexOf(max);

  const W=320, H=136, TOP=6, BOT=20;
  const plotH = H - TOP - BOT;
  const gap = nd > 28 ? 2 : 2.6;
  const barW = (W - gap*(nd-1))/nd;
  const now = new Date();
  const todayD = (now.getFullYear()===viewNam && now.getMonth()+1===viewThang) ? now.getDate() : -1;

  const bars = totals.map((v,i)=>{
    const x = i*(barW+gap);
    const h = v>0 ? Math.max(3, (v/max)*plotH) : 2;
    const y = TOP + plotH - h;
    const fill = v<=0 ? '#E1E6F0' : ((i+1)===todayD ? '#F59E0B' : 'url(#gBar)');
    return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${h.toFixed(2)}" rx="${Math.min(2.4, barW/2).toFixed(2)}" fill="${fill}"/>`;
  }).join('');

  const avgY = TOP + plotH - (tbNgayCoChi/max)*plotH;
  const ticks = [];
  for(let d=1; d<=nd; d++){
    if(d===1 || d%5===0){
      const x = (d-1)*(barW+gap) + barW/2;
      ticks.push(`<text x="${x.toFixed(2)}" y="${H-6}" text-anchor="middle" font-size="8.5" fill="#9AA6BA" font-family="IBM Plex Mono,monospace">${d}</text>`);
    }
  }

  return `
  <div class="chart-panel">
    <div class="chart-head">
      <h3 class="chart-title">Chi theo từng ngày</h3>
      <span class="chart-note">Cao nhất ${fmtShort(max)}</span>
    </div>
    <p class="chart-sub">Ngày <b>${maxIdx+1}/${viewThang}</b> tiêu nhiều nhất (${fmt(max)}). Trung bình <b>${fmt(tbNgayCoChi)}</b>/ngày có chi — đường đứt đỏ.</p>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cột chi tiêu từng ngày trong tháng ${viewThang}/${viewNam}">
      <defs>
        <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4338CA"/><stop offset="100%" stop-color="#0EA5E9"/>
        </linearGradient>
      </defs>
      ${bars}
      <line x1="0" y1="${avgY.toFixed(2)}" x2="${W}" y2="${avgY.toFixed(2)}" stroke="#EF4444" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
      ${ticks.join('')}
    </svg>
  </div>`;
}

/* ---------- Biểu đồ 2: cơ cấu chi theo hạng mục (vành khuyên + thanh) ---------- */
function chartCategory(rowsOfMonth, viewThang, viewNam){
  const byLoai = {};
  rowsOfMonth.forEach(r=>{ byLoai[r.loai] = (byLoai[r.loai]||0) + (Number(r.soTien)||0); });
  const entries = Object.entries(byLoai).filter(([,v])=>v>0).sort((a,b)=> b[1]-a[1]);
  const tong = entries.reduce((s,[,v])=>s+v,0);
  if(!tong) return '';

  const R=44, SW=17, CIRC=2*Math.PI*R;
  let acc = 0;
  const arcs = entries.map(([loai,v])=>{
    const frac = v/tong;
    const len = frac*CIRC;
    const seg = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${catColor(loai)}" stroke-width="${SW}"
      stroke-dasharray="${(len-1.5).toFixed(2)} ${(CIRC-len+1.5).toFixed(2)}"
      stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 60 60)" stroke-linecap="butt"/>`;
    acc += len;
    return seg;
  }).join('');

  const maxV = entries[0][1];
  const legend = entries.map(([loai,v])=>`
    <div class="legend-row">
      <span class="legend-dot" style="background:${catColor(loai)}"></span>
      <div class="legend-body">
        <div class="legend-top">
          <span class="legend-name">${esc(loai)}</span>
          <span class="legend-val">${fmt(v)}</span>
        </div>
        <div class="legend-bar"><i style="width:${(v/maxV*100).toFixed(1)}%; background:${catColor(loai)}"></i></div>
      </div>
      <span class="legend-pct">${(v/tong*100).toFixed(0)}%</span>
    </div>`).join('');

  return `
  <div class="chart-panel">
    <div class="chart-head">
      <h3 class="chart-title">Tiêu vào những gì</h3>
      <span class="chart-note">${entries.length} hạng mục</span>
    </div>
    <p class="chart-sub"><b>${esc(entries[0][0])}</b> chiếm nhiều nhất — ${(entries[0][1]/tong*100).toFixed(0)}% tổng chi tháng ${viewThang}/${viewNam}.</p>
    <svg class="chart-donut" viewBox="0 0 120 120" role="img" aria-label="Biểu đồ vành khuyên cơ cấu chi tiêu theo hạng mục">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="#EDF1F9" stroke-width="${SW}"/>
      ${arcs}
      <text x="60" y="57" text-anchor="middle" font-size="9" fill="#9AA6BA" font-family="Inter,sans-serif">Tổng chi</text>
      <text x="60" y="71" text-anchor="middle" font-size="14" font-weight="600" fill="#1E2A3C" font-family="IBM Plex Mono,monospace">${fmtShort(tong)}</text>
    </svg>
    <div class="legend">${legend}</div>
  </div>`;
}

/* ---------- Biểu đồ 3: xu hướng 6 tháng gần nhất (chạm để nhảy tháng) ---------- */
function chartTrend(viewThang, viewNam){
  const months = [];
  for(let i=5;i>=0;i--) months.push(addMonths(viewThang, viewNam, -i));
  const vals = months.map(m=> state.ct.reduce((s,r)=> s + (inMonth(r.ngay, m.thang, m.nam) ? (Number(r.soTien)||0) : 0), 0));
  const max = Math.max(...vals, 1);
  if(vals.every(v=>v===0)) return '';

  const W=320, H=128, TOP=16, BOT=20;
  const plotH = H - TOP - BOT;
  const gap = 10, n = months.length;
  const barW = (W - gap*(n-1))/n;

  const bars = months.map((m,i)=>{
    const v = vals[i];
    const x = i*(barW+gap);
    const h = v>0 ? Math.max(3, (v/max)*plotH) : 2;
    const y = TOP + plotH - h;
    const isView = (m.thang===viewThang && m.nam===viewNam);
    const fill = v<=0 ? '#E1E6F0' : (isView ? 'url(#gTrend)' : '#C7D2FE');
    return `<g data-jump="${m.thang}-${m.nam}" style="cursor:pointer">
      <rect x="${x.toFixed(2)}" y="0" width="${barW.toFixed(2)}" height="${H}" fill="transparent"/>
      <rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${h.toFixed(2)}" rx="4" fill="${fill}"/>
      <text x="${(x+barW/2).toFixed(2)}" y="${Math.max(10, y-5).toFixed(2)}" text-anchor="middle" font-size="9" font-weight="600"
        fill="${isView?'#4338CA':'#9AA6BA'}" font-family="IBM Plex Mono,monospace">${v>0?fmtShort(v):'—'}</text>
      <text x="${(x+barW/2).toFixed(2)}" y="${H-6}" text-anchor="middle" font-size="9"
        fill="${isView?'#4338CA':'#9AA6BA'}" font-weight="${isView?'700':'400'}" font-family="IBM Plex Mono,monospace">T${m.thang}</text>
    </g>`;
  }).join('');

  const prev = vals[4], cur = vals[5];
  let delta = '';
  if(prev>0 && cur>0){
    const pct = (cur-prev)/prev*100;
    delta = pct>=0
      ? `Tăng <b style="color:var(--rust)">${pct.toFixed(0)}%</b> so với tháng trước.`
      : `Giảm <b style="color:var(--jade)">${Math.abs(pct).toFixed(0)}%</b> so với tháng trước.`;
  }

  return `
  <div class="chart-panel">
    <div class="chart-head">
      <h3 class="chart-title">Xu hướng 6 tháng</h3>
      <span class="chart-note">chạm cột để xem</span>
    </div>
    <p class="chart-sub">${delta || 'Tổng chi của từng tháng, tính đến tháng đang xem.'}</p>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ xu hướng chi tiêu 6 tháng">
      <defs>
        <linearGradient id="gTrend" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4338CA"/><stop offset="100%" stop-color="#0EA5E9"/>
        </linearGradient>
      </defs>
      ${bars}
    </svg>
  </div>`;
}

/* ---------- Biểu đồ 4: thực chi so với ngân sách từng hạng mục ---------- */
function chartVsBudget(viewThang, viewNam){
  const rows = computeBBRowsFor(viewThang, viewNam).filter(r=> r.tong>0 || r.daChi>0);
  if(!rows.length) return '';
  const soVuot = rows.filter(r=>r.conLai<0).length;

  const list = rows.sort((a,b)=> (b.daChi/(b.tong||1)) - (a.daChi/(a.tong||1))).map(r=>{
    const pct = r.tong>0 ? (r.daChi/r.tong*100) : (r.daChi>0?100:0);
    const over = r.conLai < 0;
    return `
    <div class="legend-row">
      <span class="legend-dot" style="background:${catColor(r.loai)}"></span>
      <div class="legend-body">
        <div class="legend-top">
          <span class="legend-name">${esc(r.loai)}${over?'<span class="bdg over">vượt</span>':''}</span>
          <span class="legend-val">${fmtShort(r.daChi)} / ${fmtShort(r.tong)}</span>
        </div>
        <div class="legend-bar">
          <i style="width:${Math.min(100,pct).toFixed(1)}%; background:${over?'var(--rust)':catColor(r.loai)}"></i>
        </div>
      </div>
      <span class="legend-pct" style="color:${over?'var(--rust)':'var(--ink-faint)'}">${pct.toFixed(0)}%</span>
    </div>`;
  }).join('');

  return `
  <div class="chart-panel">
    <div class="chart-head">
      <h3 class="chart-title">Thực chi vs ngân sách</h3>
      <span class="chart-note">${soVuot?`${soVuot} hạng mục vượt`:'chưa vượt hạng mục nào'}</span>
    </div>
    <p class="chart-sub">Mỗi thanh là phần ngân sách tháng ${viewThang}/${viewNam} đã dùng hết. Thanh đỏ = đã tiêu quá mức đặt ra.</p>
    <div class="legend">${list}</div>
  </div>`;
}

   VIEW: Chi tiêu (CT)

/* Thanh điều hướng tháng dùng chung cho cả Tổng quan và Chi tiêu.
   `scope` = 'tccn' | 'ct' → quyết định id của các nút. */
function renderMonthNav(scope, viewThang, viewNam, rel){
  const sub = rel>0 ? '<span class="month-pick-sub future">TƯƠNG LAI</span>'
    : rel<0 ? '<span class="month-pick-sub past">ĐÃ QUA</span>'
    : '<span class="month-pick-sub now">THÁNG HIỆN TẠI</span>';
  const mm = String(viewThang).padStart(2,'0');
  return `
  <div class="month-nav">
    <button type="button" class="month-nav-btn" id="${scope}PrevMonth" aria-label="Tháng trước">‹</button>
    <div class="month-pick">
      <span class="month-pick-main">Tháng ${viewThang}/${viewNam}</span>
      ${sub}
      <input type="month" id="${scope}MonthPick" value="${viewNam}-${mm}" aria-label="Chọn tháng">
    </div>
    <button type="button" class="month-nav-btn" id="${scope}NextMonth" aria-label="Tháng sau">›</button>
    ${rel!==0 ? `<button type="button" class="month-nav-today" id="${scope}TodayMonth" aria-label="Về tháng hiện tại" title="Về tháng hiện tại">↺</button>` : ''}
  </div>`;
}

function viewCT(){
  const curThang = state.meta.thang, curNam = state.meta.nam;
  const viewThang = state.ui.ctViewThang ?? curThang;
  const viewNam = state.ui.ctViewNam ?? curNam;
  const rel = cmpMonth(viewThang, viewNam, curThang, curNam); // <0 quá khứ, 0 hiện tại, >0 tương lai
  const mode = state.ui.ctMode;                               // 'ngay' | 'chart' | 'all'
  const theoThang = mode !== 'all';
  state.ui.ctChiThangNay = theoThang;                         // giữ tương thích dữ liệu cũ

  const loaiOptions = state.bb.map(b=>b.loai);
  const allRows = state.ct.slice().sort((a,b)=> (b.ngay||'').localeCompare(a.ngay||''));
  const monthRows = allRows.filter(r=> inMonth(r.ngay, viewThang, viewNam));
  const rows = theoThang ? monthRows : allRows;

  /* ---------- Dải tóm tắt nhanh ---------- */
  const tong = rows.reduce((s,r)=> s + (Number(r.soTien)||0), 0);
  const days = groupByDay(rows);
  const maxDay = days.reduce((m,d)=> Math.max(m, d.tong), 0);
  const nd = daysInMonth(viewThang, viewNam);
  const now = new Date();
  const laThangNay = (now.getFullYear()===viewNam && now.getMonth()+1===viewThang);
  const soNgayDaQua = laThangNay ? now.getDate() : nd;
  const tbMoiNgay = theoThang ? (tong / Math.max(1, soNgayDaQua)) : (days.length ? tong/days.length : 0);
  const homNay = days.find(d=> d.ngay === todayStr());

  const quickStats = `
  <div class="quickstats">
    <div class="qs">
      <div class="qs-label">${theoThang?`Tổng T${viewThang}`:'Tổng tất cả'}</div>
      <div class="qs-value rust">${fmtShort(tong)}</div>
    </div>
    <div class="qs">
      <div class="qs-label">Hôm nay</div>
      <div class="qs-value ${homNay?'brass':''}">${homNay?fmtShort(homNay.tong):'0'}</div>
    </div>
    <div class="qs">
      <div class="qs-label">TB mỗi ngày</div>
      <div class="qs-value">${fmtShort(tbMoiNgay)}</div>
    </div>
    <div class="qs">
      <div class="qs-label">Số khoản</div>
      <div class="qs-value jade">${rows.length}</div>
    </div>
  </div>`;

  /* ---------- Bộ chuyển chế độ xem ---------- */
  const seg = `
  <div class="seg" role="tablist">
    <button type="button" data-ctmode="ngay"  class="${mode==='ngay'?'active':''}"  role="tab">Theo ngày</button>
    <button type="button" data-ctmode="chart" class="${mode==='chart'?'active':''}" role="tab">Biểu đồ</button>
    <button type="button" data-ctmode="all"   class="${mode==='all'?'active':''}"   role="tab">Tất cả</button>
  </div>`;

  const monthNav = theoThang ? renderMonthNav('ct', viewThang, viewNam, rel) : '';

  /* ---------- Nội dung theo chế độ ---------- */
  let content = '';

  if(mode === 'chart'){
    content = monthRows.length
      ? chartDaily(monthRows, viewThang, viewNam)
        + chartCategory(monthRows, viewThang, viewNam)
        + chartVsBudget(viewThang, viewNam)
        + chartTrend(viewThang, viewNam)
      : `<div class="chart-panel"><p class="chart-sub" style="margin:0; text-align:center; padding:14px 0">
           Tháng ${viewThang}/${viewNam} chưa có khoản chi nào. Bấm nút <b>+</b> để thêm khoản đầu tiên.
         </p></div>` + chartTrend(viewThang, viewNam);

  } else {
    /* Xem theo từng ngày — mỗi ngày là một thẻ mở ra xem được đã tiêu những gì */
    if(!days.length){
      content = `<div class="chart-panel"><p class="chart-sub" style="margin:0; text-align:center; padding:14px 0">
        Chưa có khoản chi nào${theoThang?` trong tháng ${viewThang}/${viewNam}`:''}. Bấm nút <b>+</b> ở góc phải màn hình để thêm.
      </p></div>`;
    } else {
      let lastMonthKey = '';
      content = days.map(d=>{
        const info = dayHeadInfo(d.ngay);
        const collapsed = state.ui.ctCollapsedDays.includes(d.ngay);
        // Ở chế độ "Tất cả", chèn tiêu đề tháng mỗi khi sang tháng mới
        let sep = '';
        if(!theoThang){
          const key = info.thang+'/'+info.nam;
          if(key !== lastMonthKey){
            lastMonthKey = key;
            sep = `<div class="section-sub" style="margin:16px 0 8px; font-weight:700; color:var(--ink)">Tháng ${key}</div>`;
          }
        }
        const items = d.items.map(it=>`
          <button type="button" class="txn" data-edit-ct="${it.id}">
            <span class="txn-dot" style="background:${catColor(it.loai)}"></span>
            <span class="txn-body">
              <span class="txn-name">${esc(it.chiTiet) || '(không ghi chi tiết)'}</span>
              <span class="txn-meta">${esc(it.loai)}</span>
            </span>
            <span class="txn-amt">${fmt(it.soTien)}</span>
            <span class="txn-edit">›</span>
          </button>`).join('');

        return sep + `
        <div class="day-card ${collapsed?'':'open'} ${info.isToday?'is-today':''}">
          <button type="button" class="day-head" data-day-toggle="${d.ngay}" aria-expanded="${collapsed?'false':'true'}">
            <span class="day-datebox">
              <span class="day-dd">${info.dd}</span>
              <span class="day-dow">${info.dow}</span>
            </span>
            <span class="day-mid">
              <span class="day-count">${d.items.length} khoản${info.full?` · ${info.full}`:''}</span>
              <span class="day-meter"><i style="width:${maxDay? (d.tong/maxDay*100).toFixed(1):0}%"></i></span>
            </span>
            <span class="day-right">
              <span class="day-total">${fmt(d.tong)}</span>
              <span class="day-chev">▼</span>
            </span>
          </button>
          <div class="day-items">${items}</div>
        </div>`;
      }).join('');

      content += `
      <div style="display:flex; gap:9px; margin-top:12px">
        <button type="button" class="btn" id="ctExpandAll" style="flex:1">Mở tất cả</button>
        <button type="button" class="btn" id="ctCollapseAll" style="flex:1">Thu gọn tất cả</button>
      </div>`;
    }
  }

  const addForm = `
    <form class="add-form" data-add="ct">
      <input type="date" name="ngay" value="${todayStr()}" required>
      <input type="text" name="chiTiet" placeholder="Chi tiết (VD: Trà đá)" required>

      <select name="loai">${loaiOptions.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>
      <button type="submit">+ Thêm khoản chi</button>
    </form>`;

  return `
  <div class="section-title">Chi tiêu chi tiết</div>
  <p class="section-sub">Chạm vào một khoản bất kỳ để sửa hoặc xoá. Chạm vào tên tháng để nhảy thẳng tới tháng cần xem.</p>

  ${seg}
  ${monthNav}
  ${quickStats}
  ${content}

  ${wrapAddForm('ct', 'Thêm khoản chi (nhập nhiều dòng)', addForm)}
  `;
}

/* ---------- Gom danh sách theo THÁNG/NĂM, tách riêng phần đã xong / chưa xong ---------- */
function groupByMonthArr(rows){
  const map = new Map();
  rows.forEach(r=>{
    const thang = Number(r.thang)||0, nam = Number(r.nam)||0;
    if(!thang || !nam) return;
    const key = nam*100+thang;
    if(!map.has(key)) map.set(key, {thang, nam, paid:0, unpaid:0, tong:0, soLuong:0});
    const g = map.get(key);
    const v = Number(r.soTien)||0;
    g.tong += v; g.soLuong++;
    if(r.daHoanThanh) g.paid += v; else g.unpaid += v;
  });
  return [...map.values()].sort((a,b)=> (a.nam-b.nam) || (a.thang-b.thang));
}

/* ---------- Biểu đồ cột chồng theo tháng — dùng chung cho Dư nợ trả góp và Vay ---------- */
function chartMonthlyStacked(rows, opts){
  const {title, emptyText, unpaidLabel='Chưa trả', paidLabel='Đã hoàn thành', maxMonths=12} = opts;
  let groups = groupByMonthArr(rows);
  if(!groups.length){
    return `<div class="chart-panel"><h3 class="chart-title">${title}</h3>
      <p class="chart-sub" style="margin:8px 0 0">${emptyText}</p></div>`;
  }
  if(groups.length > maxMonths) groups = groups.slice(-maxMonths);

  const max = Math.max(...groups.map(g=>g.tong), 1);
  const W=320, H=150, TOP=18, BOT=22;
  const plotH = H - TOP - BOT;
  const n = groups.length;
  const gap = n>8 ? 5 : 10;
  const barW = (W - gap*(n-1))/n;
  const tongTat = groups.reduce((s,g)=>s+g.tong,0);
  const tongChua = groups.reduce((s,g)=>s+g.unpaid,0);

  const bars = groups.map((g,i)=>{
    const x = i*(barW+gap);
    const hUnpaid = g.unpaid>0 ? Math.max(2,(g.unpaid/max)*plotH) : 0;
    const hPaid = g.paid>0 ? Math.max(2,(g.paid/max)*plotH) : 0;
    const yUnpaid = TOP + plotH - hUnpaid - hPaid;
    const yPaid = TOP + plotH - hPaid;
    const rUnpaid = g.unpaid>0 ? `<rect x="${x.toFixed(2)}" y="${yUnpaid.toFixed(2)}" width="${barW.toFixed(2)}" height="${hUnpaid.toFixed(2)}" rx="3" fill="#EF4444"/>` : '';
    const rPaid = g.paid>0 ? `<rect x="${x.toFixed(2)}" y="${yPaid.toFixed(2)}" width="${barW.toFixed(2)}" height="${hPaid.toFixed(2)}" rx="3" fill="#0EA968"/>` : '';
    const rEmpty = g.tong<=0 ? `<rect x="${x.toFixed(2)}" y="${(TOP+plotH-2).toFixed(2)}" width="${barW.toFixed(2)}" height="2" rx="1" fill="#E1E6F0"/>` : '';
    const topY = Math.max(9, TOP + plotH - hUnpaid - hPaid - 5);
    return `<g>
      ${rUnpaid}${rPaid}${rEmpty}
      <text x="${(x+barW/2).toFixed(2)}" y="${topY.toFixed(2)}" text-anchor="middle" font-size="8.3" font-weight="600" fill="#5B6B84" font-family="IBM Plex Mono,monospace">${g.tong>0?fmtShort(g.tong):''}</text>
      <text x="${(x+barW/2).toFixed(2)}" y="${H-6}" text-anchor="middle" font-size="8.3" fill="#9AA6BA" font-family="IBM Plex Mono,monospace">T${g.thang}/${String(g.nam).slice(2)}</text>
    </g>`;
  }).join('');

  return `
  <div class="chart-panel">
    <div class="chart-head">
      <h3 class="chart-title">${title}</h3>
      <span class="chart-note">${n} tháng · tổng ${fmtShort(tongTat)}</span>
    </div>
    <p class="chart-sub">Còn <b>${fmt(tongChua)}</b> chưa trả trong ${n} tháng gần đây.</p>
    <div class="chart-legend-mini">
      <span class="lg-item"><span class="lg-dot" style="background:#EF4444"></span>${unpaidLabel}</span>
      <span class="lg-item"><span class="lg-dot" style="background:#0EA968"></span>${paidLabel}</span>
    </div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">
      ${bars}
    </svg>
  </div>`;
}

/* ==========================================================
   VIEW: Dư nợ trả góp (DUNO)
   ========================================================== */
function viewDuNo(){

/* ==========================================================
   NORMALIZE NEW ROW (add-form submit)
   ========================================================== */
function normalizeNewRow(arrName, obj){
  switch(arrName){
    case 'ct':
      obj.soTien = parseMoney(obj.soTien);
      break;
    case 'bb':
      obj.donGia = parseMoney(obj.donGia);
      obj.soBuoiCoDinh = parseInt(obj.soBuoiCoDinh,10) || 0;
      break;
    case 'chovay':
      obj.soTien = parseMoney(obj.soTien);
      obj.daThu = false;
      break;
    case 'chotra':
      obj.soTien = parseMoney(obj.soTien);
      obj.daNhan = false;
      break;
    case 'duno':
    case 'vay':
      obj.soTien = parseMoney(obj.soTien);
      obj.ngay = parseInt(obj.ngay,10) || 1;
      obj.thang = parseInt(obj.thang,10) || state.meta.thang;
      obj.nam = parseInt(obj.nam,10) || state.meta.nam;
      obj.daHoanThanh = false;
      break;
  }
}

function fillQuickAddLoaiOptions(){
  const sel = document.getElementById('qaLoai');
  const loaiOptions = state.bb.map(b=>b.loai);
  sel.innerHTML = loaiOptions.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
}
/* editId = null → thêm mới; editId = id → mở đúng khoản đó ra để sửa/xoá.
   Dùng chung một tấm sheet cho cả hai việc: trên điện thoại, gõ vào ô nhỏ xíu trong
   bảng rất khó, còn tấm sheet này có ô cao 46px, bàn phím số bật sẵn. */
let editingCtId = null;
function openQuickAdd(editId){
  fillQuickAddLoaiOptions();
  const row = editId ? state.ct.find(r=>r.id===editId) : null;
  editingCtId = row ? editId : null;

  document.getElementById('qaSoTien').value  = row ? formatNumberPlain(row.soTien) : '';
  document.getElementById('qaChiTiet').value = row ? (row.chiTiet||'') : '';
  document.getElementById('qaNgay').value    = row ? (row.ngay||todayStr()) : todayStr();
  if(row){
    const sel = document.getElementById('qaLoai');
    // Hạng mục cũ có thể đã bị đổi tên/xoá ở tab Ngân sách — vẫn phải hiện đúng giá trị
    if(![...sel.options].some(o=>o.value===row.loai)){
      sel.insertAdjacentHTML('afterbegin', `<option value="${esc(row.loai)}">${esc(row.loai)} (đã bỏ)</option>`);
    }
    sel.value = row.loai;
  }

  document.getElementById('quickAddTitle').textContent   = row ? 'Sửa khoản chi' : 'Thêm chi tiêu nhanh';
  document.getElementById('quickAddSubmit').textContent  = row ? '✓ Lưu thay đổi' : '+ Lưu khoản chi';
  document.getElementById('quickAddDeleteWrap').style.display = row ? 'flex' : 'none';

  document.getElementById('quickAddOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  // Khi sửa thì không tự bật bàn phím — người dùng thường chỉ muốn xem lại rồi xoá.
  if(!row) setTimeout(()=>{ document.getElementById('qaSoTien').focus(); }, 50);
}
function closeQuickAdd(){
  document.getElementById('quickAddOverlay').classList.remove('open');
  document.body.style.overflow = '';
  editingCtId = null;
}

   BACK TO TOP (nút về đầu trang)

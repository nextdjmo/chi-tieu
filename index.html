<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1B2420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sổ Chi Tiêu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F7FC;
    --paper-2:#EAEFFA;
    --panel:#FFFFFF;
    --ink:#1E2A3C;
    --ink-soft:#5B6B84;
    --ink-faint:#9AA6BA;
    --brass:#4F46E5;
    --brass-soft:#E4E1FC;
    --jade:#0EA968;
    --jade-bg:#DFF7EA;
    --rust:#EF4444;
    --rust-bg:#FDE7E6;
    --line:#E1E6F0;
    --line-soft:#EDF1F9;
    --white:#FFFFFF;
    --header-grad:linear-gradient(120deg,#4338CA 0%,#0EA5E9 100%);
    --accent-2:#FBBF24;

    /* one consistent control size for every input/select/button in the app */
    --ctrl-h:42px;
    --r-sm:9px;      /* inputs, buttons, chips */
    --r-md:13px;     /* panels, cards, sheets */
    --r-lg:18px;     /* bottom sheet */
    --gap:10px;
    --shadow:0 1px 2px rgba(30,42,60,.05), 0 3px 12px rgba(30,42,60,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:13px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .money{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; white-space:nowrap;}
  a{color:inherit;}
  input, select, button{font:inherit;}

  /* ---------- Header ---------- */
  header.masthead{
    background:var(--header-grad);
    color:#FFFFFF;
    padding:16px 18px;
    border-bottom:none;
  }
  .masthead-inner{
    max-width:1080px; margin:0 auto;
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:4px 14px;
  }
  .masthead-title{
    font-family:'Fraunces',serif; font-style:italic; font-weight:600;
    font-size:21px; letter-spacing:.2px;
  }
  .masthead-title span{color:var(--accent-2);}
  .masthead-meta{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:rgba(255,255,255,.78);
    display:flex; gap:6px 14px; flex-wrap:wrap;
  }
  .masthead-meta b{color:#FFFFFF; font-weight:600;}

  /* ---------- Nav tabs ---------- */
  nav.tabs{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    box-shadow:var(--shadow);
  }
  .tabs-inner{
    max-width:1080px; margin:0 auto;
    display:flex; overflow-x:auto; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .tabs-inner::-webkit-scrollbar{display:none;}
  .tab-btn{
    appearance:none; border:none; background:transparent; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    color:var(--ink-soft); padding:12px 15px; white-space:nowrap;
    border-bottom:2.5px solid transparent;
    transition:color .15s, border-color .15s, background .15s;
    flex-shrink:0;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--brass);}

  /* ---------- Add-panel (collapsible "thêm mới" form) ---------- */
  .add-panel{padding:14px 16px;}
  .add-panel-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .add-panel-head h3{margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--ink-soft); flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .btn-toggle-add{
    appearance:none; border:none; background:var(--brass); color:var(--white);
    width:30px; height:30px; border-radius:50%; cursor:pointer; flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center;
    transition:background .15s, transform .15s;
  }
  .btn-toggle-add:hover{background:#3D33C9;}
  .btn-toggle-add:active{transform:scale(.94);}
  .btn-toggle-add .toggle-icon{display:inline-block; font-size:16px; font-weight:600; line-height:1; transition:transform .2s;}
  .btn-toggle-add.open .toggle-icon{transform:rotate(45deg);}
  .add-form-wrap{overflow:hidden; max-height:0; transition:max-height .2s ease;}
  .add-form-wrap.open{max-height:700px; margin-top:12px;}
  .add-form-wrap .add-form{border-top:none; background:var(--paper-2); border-radius:var(--r-sm);}

  /* ---------- Main ---------- */
  main{max-width:1080px; margin:0 auto; padding:18px 16px 56px;}
  .section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin:0 0 3px;
  }
  .section-sub{color:var(--ink-soft); font-size:13px; margin:0 0 16px; line-height:1.5;}

  .panel{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-md);
    box-shadow:var(--shadow); padding:16px 17px; margin-bottom:16px;
  }
  .panel h3{margin:0 0 5px; font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
  .panel .hint{font-size:13px; color:var(--ink-soft); margin:0 0 14px; line-height:1.55;}

  /* ---------- Cards (dashboard) ---------- */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px; margin-bottom:16px;}
  .card{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-md);
    padding:13px 14px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brass-soft);}
  .card.jade::before{background:var(--jade);}
  .card.rust::before{background:var(--rust);}
  .card.brass::before{background:var(--brass);}
  .card-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; line-height:1.35;}
  .card-value{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2;}
  .card-value.jade{color:var(--jade);}
  .card-value.rust{color:var(--rust);}

  .banner{
    border-radius:var(--r-sm); padding:12px 14px; font-size:13px; margin-bottom:16px;
    display:flex; gap:9px; align-items:flex-start; border:1px solid; line-height:1.5;
  }
  .banner.warn{background:var(--rust-bg); border-color:#F7B4AF; color:#B42318;}
  .banner.ok{background:var(--jade-bg); border-color:#A9E8C7; color:#08703F;}
  .banner.info{background:var(--paper-2); border-color:var(--line); color:var(--ink-soft);}
  .banner.setup{background:var(--brass-soft); border-color:var(--brass); color:#3730A3;}

  /* ---------- Meta form (Tổng quan settings) ---------- */
  .meta-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;}
  .meta-grid .field-full{grid-column:1 / -1;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field input, .field select{
    width:100%; height:var(--ctrl-h); padding:0 11px; border:1px solid var(--line); border-radius:var(--r-sm);
    background:var(--white); font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink);
    box-sizing:border-box; line-height:normal; -webkit-appearance:none; appearance:none;
  }
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2357624F'/></svg>");
    background-repeat:no-repeat; background-position:right 11px center; padding-right:28px;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(79,70,229,.16);}

  /* ---------- Tables (desktop) ---------- */
  .table-scroll{overflow-x:auto; border:1px solid var(--line-soft); border-radius:var(--r-md); background:var(--panel);}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
  thead th{
    text-align:left; padding:10px 12px; background:var(--paper-2); color:var(--ink-soft);
    font-size:11px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{padding:6px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tbody tr:hover{background:#F4F5EF;}
  tbody tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;}
  td.center, th.center{text-align:center;}

  table input[type=text], table input[type=date], table input[type=number], table select{
    width:100%; min-width:76px; height:36px; box-sizing:border-box; padding:0 8px; border:1px solid transparent; border-radius:7px;
    background:transparent; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink);
  }
  table input:hover, table select:hover{border-color:var(--line);}
  table input:focus, table select:focus{border-color:var(--brass); background:var(--white); outline:none;}
  table input.txt{font-family:'Inter',sans-serif;}
  table input[type=checkbox]{width:18px; height:18px; accent-color:var(--jade); margin:0;}

  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.02em;}
  .pill.ok{background:var(--jade-bg); color:var(--jade);}
  .pill.warn{background:var(--rust-bg); color:var(--rust);}

  .btn-icon{
    appearance:none; border:none; background:transparent; cursor:pointer; color:var(--ink-faint);
    width:30px; height:30px; border-radius:7px; line-height:1; font-size:16px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .btn-icon:hover{color:var(--rust); background:var(--rust-bg);}

  /* ---------- Add-row form ----------
     One consistent flex system for every screen size: narrow fields (ngày/tháng/năm,
     which carry an inline max-width) sit together on one line; every other field
     is flex:1 and wraps onto its own row once space runs out. */
  .add-form{
    display:flex; flex-wrap:wrap; gap:8px; padding:14px; border-top:1px dashed var(--line);
    background:var(--paper-2); border-radius:0 0 var(--r-md) var(--r-md);
  }
  .add-form input, .add-form select{
    height:var(--ctrl-h); box-sizing:border-box; padding:0 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--white);
    font-family:'Inter',sans-serif; font-size:14px; flex:1 1 170px; min-width:130px;
    -webkit-appearance:none; appearance:none; color:var(--ink);
  }
  .add-form input[style]{flex:0 0 auto; min-width:0; text-align:center;} /* ngày/tháng/năm — narrow, grouped */
  .add-form input:focus, .add-form select:focus{outline:none; border-color:var(--brass); background:var(--white); box-shadow:0 0 0 3px rgba(79,70,229,.16);}
  .add-form button{
    appearance:none; border:none; background:var(--brass); color:#FFFFFF; font-weight:600;
    height:var(--ctrl-h); padding:0 18px; border-radius:var(--r-sm); cursor:pointer; font-size:14px; white-space:nowrap;
    flex:1 1 100%; margin-top:2px;
  }
  .add-form button:hover, .add-form button:active{background:#3D33C9;}

  .empty-state{
    padding:24px 18px; text-align:center; color:var(--ink-soft); font-size:13px; line-height:1.55;
  }

  .summary-row{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;
  }
  .summary-chip{
    background:var(--paper-2); border:1px solid var(--line-soft); border-radius:var(--r-sm);
    padding:9px 13px; font-size:12px; color:var(--ink-soft); flex:1 1 150px;
  }
  .summary-chip b{display:block; font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--ink); margin-top:3px; font-weight:600;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
  .toolbar label{font-size:13px; color:var(--ink-soft); display:flex; gap:8px; align-items:center;}
  .toolbar input[type=checkbox]{width:17px; height:17px; accent-color:var(--brass);}

  .btn{
    appearance:none; border:1px solid var(--line); background:var(--white); color:var(--ink);
    height:var(--ctrl-h); padding:0 18px; border-radius:var(--r-sm); font-weight:600; font-size:14px; cursor:pointer;
  }
  .btn:hover{border-color:var(--brass); color:var(--brass);}
  .btn.primary{background:var(--brass); color:#FFFFFF; border-color:var(--brass);}
  .btn.primary:hover{background:#3D33C9; border-color:#3D33C9; color:#FFFFFF;}
  .btn.danger{color:var(--rust); border-color:var(--rust-bg);}
  .btn.danger:hover{background:var(--rust-bg);}

  footer{
    text-align:center; color:var(--ink-faint); font-size:12px; padding:18px 16px 30px; border-top:1px solid var(--line-soft);
    line-height:1.6;
  }

  /* ---------- Floating quick-add button ---------- */
  .fab-add{
    position:fixed; right:18px; bottom:22px; z-index:60;
    width:52px; height:52px; border-radius:50%;
    background:var(--header-grad); color:#FFFFFF; border:none;
    font-size:26px; line-height:1; font-weight:500;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(79,70,229,.35), 0 1px 3px rgba(30,42,60,.15);
    cursor:pointer;
  }
  .fab-add:active{opacity:.88;}

  /* ---------- Back-to-top floating button ---------- */
  .fab-top{
    position:fixed; left:16px; bottom:24px; z-index:55;
    width:38px; height:38px; border-radius:50%;
    background:rgba(250,250,246,.92); color:var(--ink-faint); border:1px solid var(--line-soft);
    font-size:16px; line-height:1; backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(30,42,60,.12);
    cursor:pointer;
    opacity:0; pointer-events:none; transform:translateY(6px);
    transition:opacity .18s, transform .18s, color .15s, border-color .15s;
  }
  .fab-top.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .fab-top:hover{color:var(--brass); border-color:var(--brass);}
  .fab-top:active{background:var(--paper-2);}

  /* ---------- Quick-add sheet ---------- */
  .quick-add-overlay{
    position:fixed; inset:0; background:rgba(30,42,60,.48); z-index:100;
    display:none; align-items:flex-end; justify-content:center;
  }
  .quick-add-overlay.open{display:flex;}
  .quick-add-sheet{
    background:var(--panel); width:100%; max-width:460px;
    border-radius:var(--r-lg) var(--r-lg) 0 0; box-shadow:0 -4px 22px rgba(30,42,60,.22);
    padding:6px 18px 20px; max-height:88vh; overflow-y:auto;
  }
  .quick-add-grabber{width:36px; height:4px; background:var(--line); border-radius:99px; margin:9px auto 12px;}
  .quick-add-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .quick-add-head h3{margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .quick-add-close{
    appearance:none; border:none; background:var(--paper-2); color:var(--ink-soft);
    width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer;
  }
  .quick-add-field{margin-bottom:11px;}
  .quick-add-field label{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .quick-add-field input, .quick-add-field select{
    width:100%; height:46px; padding:0 13px; border:1px solid var(--line); border-radius:var(--r-sm);
    background:var(--white); font-size:16px; color:var(--ink); font-family:'Inter',sans-serif;
    -webkit-appearance:none; appearance:none;
  }
  .quick-add-field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2357624F'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center; padding-right:30px;
  }
  .quick-add-field input.money{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .quick-add-field input:focus, .quick-add-field select:focus{outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(79,70,229,.16);}
  .quick-add-submit{
    width:100%; height:48px; border:none; border-radius:var(--r-sm); margin-top:2px;
    background:var(--brass); color:#FFFFFF; font-weight:700; font-size:14px; cursor:pointer;
  }
  .quick-add-submit:active{background:#3D33C9;}

  /* ---------- Month navigator (Tổng quan) ---------- */
  .month-nav{
    display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;
  }
  .month-nav-btn{
    appearance:none; border:1px solid var(--line); background:var(--white); color:var(--ink);
    width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:16px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .month-nav-btn:hover{border-color:var(--brass); color:var(--brass);}
  .month-nav-label{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px; min-width:120px; text-align:center; flex:0 0 auto;
  }
  .month-nav-today{
    appearance:none; border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft);
    height:34px; padding:0 13px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .month-nav-today:hover{border-color:var(--brass); color:var(--brass);}
  .month-nav-badge{
    font-size:11px; font-weight:700; letter-spacing:.03em; padding:3px 10px; border-radius:999px;
  }
  .month-nav-badge.future{background:var(--brass-soft); color:#3730A3;}
  .month-nav-badge.past{background:var(--paper-2); color:var(--ink-soft);}
  .month-nav-badge.now{background:var(--jade-bg); color:var(--jade);}

  /* ==========================================================
     MOBILE (primary usage surface for this app)
     ========================================================== */
  @media (max-width: 700px){
    main{padding:14px 12px 84px;}
    .section-title{font-size:16px;}
    .panel{padding:14px 14px;}

    .cards{grid-template-columns:1fr 1fr; gap:8px;}
    .card{padding:11px 12px;}
    .card-value{font-size:16px;}

    /* iOS zoom-on-focus prevention: every form control (table/add-form/field/quick-add)
       already renders at 16px — quick-add-field inputs are 16px at every breakpoint too,
       so this single rule keeps ALL inputs in the app on one shared size on mobile. */
    table input, table select, .add-form input, .add-form select, .field input, .field select{
      font-size:16px;
    }

    /* Tables become compact stacked cards on narrow screens */
    .table-scroll{overflow-x:visible; border:none; background:transparent; box-shadow:none;}
    table{min-width:0; width:100%;}
    thead{display:none;}
    tbody{display:block;}
    tbody tr{
      display:block; background:var(--panel); border:1px solid var(--line-soft);
      border-radius:var(--r-md); box-shadow:var(--shadow); margin-bottom:8px; padding:2px 0;
    }
    tbody tr:hover{background:var(--panel);}
    tbody td{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:8px 13px; border-bottom:1px solid var(--line-soft); text-align:right; min-height:38px;
    }
    tbody tr td:last-child{border-bottom:none;}
    tbody td::before{
      content:attr(data-label); font-size:11px; font-weight:700; color:var(--ink-soft);
      text-transform:uppercase; letter-spacing:.03em; text-align:left; flex:0 0 auto;
    }
    tbody td.empty-state{display:block; text-align:center; padding:20px 16px;}
    tbody td.empty-state::before{content:none;}
    table input, table select{text-align:right; min-width:0; max-width:60%; height:36px;}
    table input.txt{text-align:right;}
    table input[type=checkbox]{width:20px; height:20px; flex:0 0 auto;}

    .add-form{padding:13px 12px;}
    .add-form input, .add-form select{flex:1 1 100%; min-width:0;}
    .add-form input[style]{flex:0 0 auto; min-width:64px;} /* keep ngày/tháng/năm grouped on one line */

    .btn{width:100%;}
    .panel .btn{width:auto;}

    .fab-add{right:16px; bottom:18px; width:54px; height:54px;}
    .fab-top{left:14px; bottom:20px;}

    .month-nav{justify-content:center;}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-title">Sổ <span>Chi Tiêu</span></div>
    <div class="masthead-meta" id="mastheadMeta"></div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" id="tabsInner"></div>
</nav>

<main id="app"></main>

<footer>
  Dữ liệu được lưu trong trình duyệt này (localStorage) — không đồng bộ qua thiết bị khác.
  Hãy tải xuống JSON định kỳ ở tab <b>Dữ liệu</b> để sao lưu.
</footer>

<!-- Nút nổi thêm chi tiêu nhanh -->
<button class="fab-add" id="fabAdd" title="Thêm chi tiêu nhanh" aria-label="Thêm chi tiêu nhanh">+</button>

<!-- Nút về đầu trang -->
<button class="fab-top" id="fabTop" title="Về đầu trang" aria-label="Về đầu trang">↑</button>

<script>
/* ==========================================================
   STATE
   ========================================================== */
const STORAGE_KEY = 'soChiTieu_v1';
const TABS = [
  {id:'tccn', label:'Tổng quan'},
  {id:'ct', label:'Chi tiêu'},
  {id:'bb', label:'Ngân sách'},
  {id:'chovay', label:'Cho vay'},
  {id:'chotra', label:'Chờ thu'},
  {id:'duno', label:'Dư nợ'},
  {id:'vay', label:'Vay'},
  {id:'data', label:'Dữ liệu'},
];
const LOAI_MAC_DINH = [
  {loai:'Ăn sáng', donGia:10000, cheDo:'auto', soBuoiCoDinh:0},
  {loai:'Ăn trưa', donGia:40000, cheDo:'auto', soBuoiCoDinh:0},
  {loai:'Người yêu', donGia:500000, cheDo:'coDinh', soBuoiCoDinh:6},
  {loai:'Đổ xăng', donGia:120000, cheDo:'coDinh', soBuoiCoDinh:4},
  {loai:'Youtube', donGia:105000, cheDo:'coDinh', soBuoiCoDinh:1},
  {loai:'Điện thoại', donGia:160000, cheDo:'coDinh', soBuoiCoDinh:1},
  {loai:'Linh tinh', donGia:300000, cheDo:'coDinh', soBuoiCoDinh:1},
  {loai:'Nhậu', donGia:400000, cheDo:'coDinh', soBuoiCoDinh:3},
];

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }

function defaultState(){
  const now = new Date();
  return {
    meta:{
      thang: now.getMonth()+1,
      nam: now.getFullYear(),
      ghiNhanNgay: todayStr(),
      tpbank: 0,
      tienMat: 0,
    },
    ct: [],
    bb: LOAI_MAC_DINH.map(x=>({id:uid(), ...x})),
    chovay: [],
    chotra: [],
    duno: [],
    vay: [],
    ui:{ currentTab:'tccn', ctChiThangNay:false, duNoThangKhac:null, duNoNamKhac:null, tccnViewThang:null, tccnViewNam:null },
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      parsed.ui = parsed.ui || { currentTab:'tccn', ctChiThangNay:false, duNoThangKhac:null, duNoNamKhac:null, tccnViewThang:null, tccnViewNam:null };
      if(parsed.ui.tccnViewThang===undefined) parsed.ui.tccnViewThang = null;
      if(parsed.ui.tccnViewNam===undefined) parsed.ui.tccnViewNam = null;
      return parsed;
    }
  }catch(e){ console.warn('Không đọc được dữ liệu cũ, khởi tạo mới.', e); }
  return defaultState();
}

let state = loadState();
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* Trạng thái mở/đóng của các khối "+ Thêm ..." — không cần lưu vào localStorage */
const addOpen = {};
function renderAddToggle(key, label){
  return `
  <div class="panel add-panel">
    <div class="add-panel-head">
      <h3>${esc(label)}</h3>
      <button type="button" class="btn-toggle-add ${addOpen[key]?'open':''}" data-toggle-add="${key}" aria-label="${addOpen[key]?'Đóng':'Mở'} form ${esc(label)}" title="${addOpen[key]?'Đóng':'Thêm mới'}">
        <span class="toggle-icon">+</span>
      </button>
    </div>
    <div class="add-form-wrap ${addOpen[key]?'open':''}" data-add-wrap="${key}">
      ###FORM###
    </div>
  </div>`;
}
function wrapAddForm(key, label, formHtml){
  return renderAddToggle(key, label).replace('###FORM###', formHtml);
}

/* ==========================================================
   HELPERS
   ========================================================== */
function fmt(n){
  n = Math.round(Number(n)||0);
  return new Intl.NumberFormat('en-US').format(n) + ' đ';
}
function formatNumberPlain(n){
  n = Math.round(Number(n)||0);
  return new Intl.NumberFormat('en-US').format(n);
}
function parseMoney(v){
  const n = parseInt(String(v).replace(/[^0-9-]/g,''),10);
  return isNaN(n) ? 0 : n;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function inMonth(dateStr, month, year){
  if(!dateStr) return false;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return false;
  return d.getFullYear()===year && (d.getMonth()+1)===month;
}
function weekdaysRemainingInMonth(year, month){
  const now = new Date();
  const isActualCurrent = (now.getFullYear()===year && (now.getMonth()+1)===month);
  const startDay = isActualCurrent ? now.getDate() : 1;
  const lastDay = new Date(year, month, 0).getDate();
  let count=0;
  for(let d=startDay; d<=lastDay; d++){
    const dow = new Date(year, month-1, d).getDay();
    if(dow>=1 && dow<=5) count++;
  }
  return count;
}
function tenThang(m,y){ return m+'/'+y; }
function isFirstSetup(){
  const m = state.meta;
  return (Number(m.tpbank)||0)===0 && (Number(m.tienMat)||0)===0 &&
    state.ct.length===0 && state.chovay.length===0 && state.chotra.length===0 &&
    state.duno.length===0 && state.vay.length===0;
}
/* Cộng/trừ số tháng vào một cặp (tháng, năm), tự động tràn qua năm khác */
function addMonths(thang, nam, delta){
  let idx = (thang-1) + delta;
  let n = nam + Math.floor(idx/12);
  let t = ((idx%12)+12)%12 + 1;
  return {thang:t, nam:n};
}
/* So sánh 2 cặp (tháng,năm): âm nếu a<b, 0 nếu bằng, dương nếu a>b */
function cmpMonth(t1,n1,t2,n2){
  if(n1!==n2) return n1-n2;
  return t1-t2;
}
/* Liệt kê tuần tự các tháng từ (t1,n1) đến (t2,n2), bao gồm cả 2 đầu — giả định t1/n1 <= t2/n2 */
function monthsBetween(t1,n1,t2,n2){
  const out=[]; let t=t1,n=n1; let guard=0;
  while(cmpMonth(t,n,t2,n2)<=0 && guard<240){
    out.push({thang:t,nam:n});
    const nx = addMonths(t,n,1); t=nx.thang; n=nx.nam; guard++;
  }
  return out;
}

/* ==========================================================
   COMPUTED (mirrors công thức trong Google Sheet)
   ========================================================== */
function computeBBRowsFor(thang, nam){
  return state.bb.map(row=>{
    const soBuoi = row.cheDo==='auto' ? weekdaysRemainingInMonth(nam, thang) : (Number(row.soBuoiCoDinh)||0);
    const tong = (Number(row.donGia)||0) * soBuoi;
    const daChi = state.ct.reduce((s,c)=> s + (c.loai===row.loai && inMonth(c.ngay, thang, nam) ? (Number(c.soTien)||0) : 0), 0);
    const conLai = tong - daChi;
    return {...row, soBuoi, tong, daChi, conLai};
  });
}
function computeBBRows(){ return computeBBRowsFor(state.meta.thang, state.meta.nam); }
function computeBBSummary(rows){
  const sumTong = rows.reduce((s,r)=>s+r.tong,0);
  const sumConLai = rows.reduce((s,r)=>s+r.conLai,0);
  const soTienDaDung = sumTong - sumConLai;
  const vuotQua = rows.reduce((s,r)=> s + (r.conLai<0 ? -r.conLai : 0), 0);
  const soTienThucTeCanSuDung = sumTong + vuotQua;
  const soTienCan = sumConLai;
  return { soTienDaDung, soTienTrongThangCan: sumTong, soTienThucTeCanSuDung, vuotQua, soTienCan };
}
function computeChoVayOutstanding(){ return state.chovay.reduce((s,r)=> s + (!r.daThu ? (Number(r.soTien)||0) : 0), 0); }
function computeChoTraOutstanding(){ return state.chotra.reduce((s,r)=> s + (!r.daNhan ? (Number(r.soTien)||0) : 0), 0); }
function computeChoTraReceived(){ return state.chotra.reduce((s,r)=> s + (r.daNhan ? (Number(r.soTien)||0) : 0), 0); }
function computeDuNoThang(thang, nam){
  return state.duno.reduce((s,r)=> s + ((Number(r.thang)===thang && Number(r.nam)===nam && !r.daHoanThanh) ? (Number(r.soTien)||0) : 0), 0);
}
function computeVayOutstanding(){ return state.vay.reduce((s,r)=> s + (!r.daHoanThanh ? (Number(r.soTien)||0) : 0), 0); }
function computeCTAllTime(){ return state.ct.reduce((s,r)=> s + (Number(r.soTien)||0), 0); }

/* Số dư thực tế "hôm nay" — không phụ thuộc tháng đang xem ở Tổng quan */
function computeSoDuHomNay(){
  const {tpbank, tienMat} = state.meta;
  const chovayOutstanding = computeChoVayOutstanding();
  const chotraOutstanding = computeChoTraOutstanding();
  const chotraReceived = computeChoTraReceived();
  const ctAllTime = computeCTAllTime();
  const soDuHienTai = (Number(tpbank)||0) + (Number(tienMat)||0) - chovayOutstanding - ctAllTime + chotraReceived;
  const soDuDayDu = soDuHienTai + chotraOutstanding;
  return { chovayOutstanding, chotraOutstanding, chotraReceived, soDuHienTai, soDuDayDu };
}

/* Tính toán Tổng quan cho MỘT tháng bất kỳ đang được xem (viewThang/viewNam),
   có tính luỹ kế từ tháng hiện tại (meta.thang/nam) tới tháng đang xem để dự phóng
   xem cần chuẩn bị bao nhiêu tiền mới đủ trả nợ + chi tiêu tới lúc đó. */
function computeTCCNForMonth(viewThang, viewNam){
  const curThang = state.meta.thang, curNam = state.meta.nam;
  const base = computeSoDuHomNay();
  const duNoVAY = computeVayOutstanding();

  // Số liệu riêng của tháng đang xem
  const bbRowsXem = computeBBRowsFor(viewThang, viewNam);
  const bbSumXem = computeBBSummary(bbRowsXem);
  const duNoThangXem = computeDuNoThang(viewThang, viewNam);
  const tongCanThangXem = bbSumXem.soTienCan + duNoThangXem;

  // Luỹ kế từ tháng hiện tại đến tháng đang xem (chỉ có ý nghĩa nếu xem >= tháng hiện tại)
  const isFutureOrCurrent = cmpMonth(viewThang, viewNam, curThang, curNam) >= 0;
  let months = [], cumNganSach = 0, cumDuNo = 0;
  if(isFutureOrCurrent){
    months = monthsBetween(curThang, curNam, viewThang, viewNam);
    months.forEach(m=>{
      const rows = (m.thang===viewThang && m.nam===viewNam) ? bbRowsXem : computeBBRowsFor(m.thang, m.nam);
      const s = computeBBSummary(rows);
      cumNganSach += s.soTienCan;
      cumDuNo += computeDuNoThang(m.thang, m.nam);
    });
  }
  const tongCanLuyKe = cumNganSach + cumDuNo;
  // Dự kiến số dư còn lại nếu phải tự trang trải toàn bộ ngân sách + nợ đến hạn từ giờ đến hết tháng đang xem
  const buTruDuKien = base.soDuDayDu - duNoVAY - tongCanLuyKe;

  return {
    isFutureOrCurrent, months,
    bbSumXem, duNoThangXem, tongCanThangXem,
    duNoVAY, cumNganSach, cumDuNo, tongCanLuyKe, buTruDuKien,
    ...base,
  };
}

/* ==========================================================
   RENDER: layout shell
   ========================================================== */
function renderMasthead(){
  const el = document.getElementById('mastheadMeta');
  el.innerHTML = `Tháng hiện tại <b>${state.meta.thang}/${state.meta.nam}</b> · Ghi nhận ngày <b>${state.meta.ghiNhanNgay ? state.meta.ghiNhanNgay.split('-').reverse().join('/') : '—'}</b>`;
}
function renderTabs(){
  const el = document.getElementById('tabsInner');
  el.innerHTML = TABS.map(t=>`<button class="tab-btn ${state.ui.currentTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
}
function renderAll(){
  renderMasthead();
  renderTabs();
  const app = document.getElementById('app');
  switch(state.ui.currentTab){
    case 'tccn': app.innerHTML = viewTCCN(); break;
    case 'ct': app.innerHTML = viewCT(); break;
    case 'bb': app.innerHTML = viewBB(); break;
    case 'chovay': app.innerHTML = viewChoVay(); break;
    case 'chotra': app.innerHTML = viewChoTra(); break;
    case 'duno': app.innerHTML = viewDuNo(); break;
    case 'vay': app.innerHTML = viewVay(); break;
    case 'data': app.innerHTML = viewData(); break;
  }
}

/* ==========================================================
   VIEW: Tổng quan (TCCN)
   ========================================================== */
function viewSetupPanel(highlight){
  return `
  <div class="panel" id="setupPanel">
    <h3>Thiết lập chung</h3>
    <p class="hint">Nhập <b>số dư ban đầu</b> (tiền đang có trong TPBank và tiền mặt) ở đây <b>một lần duy nhất</b> khi bắt đầu dùng sổ. Sau đó bạn <b>không cần sửa lại hai ô này nữa</b> — số dư sẽ tự động cộng/trừ theo các khoản ở tab Chi tiêu, Cho vay, Chờ thu, Dư nợ và Vay.</p>
    <div class="meta-grid">
      <div class="field">
        <label>Tháng hiện tại</label>
        <select data-meta="thang" data-type="number">
          ${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===state.meta.thang?'selected':''}>Tháng ${m}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Năm hiện tại</label>
        <input type="number" data-meta="nam" data-type="number" value="${state.meta.nam}">
      </div>
      <div class="field">
        <label>Ghi nhận ngày</label>
        <input type="date" data-meta="ghiNhanNgay" data-type="text" value="${state.meta.ghiNhanNgay||''}">
      </div>
      <div class="field">
        <label>Số dư TPBank (ban đầu)</label>
        <input type="text" inputmode="numeric" data-meta="tpbank" data-type="money" value="${formatNumberPlain(state.meta.tpbank)}">
      </div>
      <div class="field field-full">
        <label>Tiền mặt (ban đầu)</label>
        <input type="text" inputmode="numeric" data-meta="tienMat" data-type="money" value="${formatNumberPlain(state.meta.tienMat)}">
      </div>
    </div>
  </div>`;
}

function viewTCCN(){
  const curThang = state.meta.thang, curNam = state.meta.nam;
  const viewThang = state.ui.tccnViewThang ?? curThang;
  const viewNam = state.ui.tccnViewNam ?? curNam;
  const rel = cmpMonth(viewThang, viewNam, curThang, curNam); // <0 quá khứ, 0 hiện tại, >0 tương lai

  const t = computeTCCNForMonth(viewThang, viewNam);
  const firstSetup = isFirstSetup();

  const setupBanner = firstSetup ? `
  <div class="banner setup">👋 <div><b>Bắt đầu tại đây:</b> nhập số tiền bạn đang có (TPBank + tiền mặt) vào ô bên dưới. Chỉ cần nhập một lần — từ giờ về sau, sổ sẽ tự tính số dư của bạn dựa trên các khoản chi tiêu, cho vay và chờ thu mà bạn ghi lại.</div></div>
  ` : '';

  const badge = rel>0 ? '<span class="month-nav-badge future">Tương lai</span>'
    : rel<0 ? '<span class="month-nav-badge past">Đã qua</span>'
    : '<span class="month-nav-badge now">Tháng hiện tại</span>';

  const monthNav = `
  <div class="month-nav">
    <button type="button" class="month-nav-btn" id="tccnPrevMonth" title="Tháng trước" aria-label="Tháng trước">‹</button>
    <div class="month-nav-label mono">Tháng ${viewThang}/${viewNam}</div>
    <button type="button" class="month-nav-btn" id="tccnNextMonth" title="Tháng sau" aria-label="Tháng sau">›</button>
    ${badge}
    ${rel!==0 ? '<button type="button" class="month-nav-today" id="tccnTodayMonth">↺ Về tháng hiện tại</button>' : ''}
  </div>`;

  const thieuHutThang = (t.bbSumXem.soTienCan + t.duNoThangXem - (rel===0 ? t.soDuDayDu - t.duNoVAY : 0)) ; // không dùng trực tiếp, giữ chỗ

  const thieuHutDuKien = t.buTruDuKien < 0;

  const statusBanner = !firstSetup ? (
    rel === 0 ? (thieuHutDuKien ? `
    <div class="banner warn">⚠️ <div><b>Bù trừ đang âm ${fmt(Math.abs(t.buTruDuKien))}.</b> Sau khi trừ nợ đến hạn tháng ${viewThang}/${viewNam} và ngân sách còn lại, bạn đang thiếu hụt so với nhu cầu chi tiêu tháng này.</div></div>
    ` : `
    <div class="banner ok">✓ Bù trừ đang dương ${fmt(t.buTruDuKien)} — đủ trang trải nợ đến hạn và chi tiêu còn lại trong tháng.</div>
    `) : rel > 0 ? (thieuHutDuKien ? `
    <div class="banner warn">⚠️ <div><b>Tính từ giờ đến hết tháng ${viewThang}/${viewNam}, bạn cần chuẩn bị thêm ${fmt(Math.abs(t.buTruDuKien))}</b> mới đủ trả nợ đến hạn và chi tiêu của cả ${t.months.length} tháng (kể cả tháng hiện tại). Hãy tiết kiệm thêm hoặc giảm chi để bù khoản này.</div></div>
    ` : `
    <div class="banner ok">✓ Nếu không phát sinh gì thêm, bạn còn dư dự kiến ${fmt(t.buTruDuKien)} tính đến hết tháng ${viewThang}/${viewNam} — đủ khả năng trả nợ và chi tiêu cho ${t.months.length} tháng tới.</div>
    `) : `
    <div class="banner info">Bạn đang xem lại tháng ${viewThang}/${viewNam} (đã qua) — số liệu bên dưới là ngân sách/dư nợ thực tế của tháng đó, không tính dự phóng.</div>
    `
  ) : '';

  const cardsBlock = rel===0 || rel<0 ? `
  <div class="cards">
    <div class="card brass">
      <div class="card-label">Số dư đầy đủ (hôm nay)</div>
      <div class="card-value">${fmt(t.soDuDayDu)}</div>
    </div>
    <div class="card rust">
      <div class="card-label">Dư nợ đến hạn tháng ${viewThang}/${viewNam}</div>
      <div class="card-value">${fmt(t.duNoThangXem)}</div>
    </div>
    <div class="card brass">
      <div class="card-label">Ngân sách cần dùng tháng ${viewThang}/${viewNam}</div>
      <div class="card-value">${fmt(t.bbSumXem.soTienCan)}</div>
    </div>
    <div class="card jade">
      <div class="card-label">Tổng cần cho tháng ${viewThang}/${viewNam}</div>
      <div class="card-value jade">${fmt(t.tongCanThangXem)}</div>
    </div>
    <div class="card ${thieuHutDuKien?'rust':'jade'}">
      <div class="card-label">Bù trừ${rel===0?'':' (tháng đã qua)'}</div>
      <div class="card-value ${thieuHutDuKien?'rust':'jade'}">${fmt(t.buTruDuKien)}</div>
    </div>
  </div>` : `
  <div class="cards">
    <div class="card brass">
      <div class="card-label">Số dư đầy đủ (hôm nay)</div>
      <div class="card-value">${fmt(t.soDuDayDu)}</div>
    </div>
    <div class="card rust">
      <div class="card-label">Dư nợ đến hạn tháng ${viewThang}/${viewNam}</div>
      <div class="card-value">${fmt(t.duNoThangXem)}</div>
    </div>
    <div class="card brass">
      <div class="card-label">Ngân sách cần dùng tháng ${viewThang}/${viewNam}</div>
      <div class="card-value">${fmt(t.bbSumXem.soTienCan)}</div>
    </div>
    <div class="card rust">
      <div class="card-label">Tổng cần cộng dồn (${t.months.length} tháng, kể cả nay)</div>
      <div class="card-value">${fmt(t.tongCanLuyKe)}</div>
    </div>
    <div class="card ${thieuHutDuKien?'rust':'jade'}">
      <div class="card-label">Dự kiến dư/thiếu đến hết tháng ${viewThang}/${viewNam}</div>
      <div class="card-value ${thieuHutDuKien?'rust':'jade'}">${fmt(t.buTruDuKien)}</div>
    </div>
  </div>`;

  const setupPanel = viewSetupPanel(firstSetup);

  const summaryChips = `
  <div class="panel">
    <h3 style="margin-bottom:14px;">Đang chờ xử lý (hôm nay)</h3>
    <div class="summary-row">
      <div class="summary-chip">Đang cho vay chưa thu<b>${fmt(t.chovayOutstanding)}</b></div>
      <div class="summary-chip">Đang chờ thu về<b>${fmt(t.chotraOutstanding)}</b></div>
      <div class="summary-chip">Dư nợ trả góp đến hạn tháng ${viewThang}/${viewNam}<b>${fmt(t.duNoThangXem)}</b></div>
      <div class="summary-chip">Khoản vay chưa trả (không theo tháng)<b>${fmt(t.duNoVAY)}</b></div>
    </div>
  </div>`;

  const projectionDetail = rel>0 ? `
  <div class="panel">
    <h3 style="margin-bottom:6px;">Chi tiết dự phóng từ tháng ${curThang}/${curNam} đến tháng ${viewThang}/${viewNam}</h3>
    <p class="hint">Cộng dồn ngân sách còn cần và dư nợ trả góp đến hạn của từng tháng trong khoảng này, để biết tổng cộng bạn cần chuẩn bị bao nhiêu trước khi tới tháng ${viewThang}/${viewNam}.</p>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Tháng</th><th class="num">Ngân sách cần</th><th class="num">Dư nợ đến hạn</th><th class="num">Tổng cần</th></tr></thead>
        <tbody>
          ${t.months.map(m=>{
            const rows = computeBBRowsFor(m.thang, m.nam);
            const s = computeBBSummary(rows);
            const dn = computeDuNoThang(m.thang, m.nam);
            return `<tr>
              <td data-label="Tháng" class="mono">${m.thang}/${m.nam}</td>
              <td class="num mono" data-label="Ngân sách cần">${fmt(s.soTienCan)}</td>
              <td class="num mono" data-label="Dư nợ đến hạn">${fmt(dn)}</td>
              <td class="num mono" data-label="Tổng cần">${fmt(s.soTienCan+dn)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div class="summary-row">
      <div class="summary-chip">Tổng ngân sách cộng dồn<b>${fmt(t.cumNganSach)}</b></div>
      <div class="summary-chip">Tổng dư nợ trả góp cộng dồn<b>${fmt(t.cumDuNo)}</b></div>
      <div class="summary-chip">Khoản vay chưa trả (cộng thêm luôn, không theo tháng)<b>${fmt(t.duNoVAY)}</b></div>
      <div class="summary-chip">Cần chuẩn bị tổng cộng<b>${fmt(t.tongCanLuyKe + t.duNoVAY)}</b></div>
    </div>
  </div>` : '';

  const header = `
  <div class="section-title">Tổng quan</div>
  <p class="section-sub">Bức tranh tài chính tổng hợp — dùng nút ‹ › để xem trước ngân sách và nợ đến hạn của các tháng tương lai, giúp tính ra cần tiết kiệm bao nhiêu mới đủ trả nợ.</p>`;

  if(firstSetup){
    return header + monthNav + setupBanner + setupPanel + cardsBlock + summaryChips;
  }
  return header + monthNav + statusBanner + cardsBlock + projectionDetail + setupPanel + summaryChips;
}

/* ==========================================================

function viewCT(){
  const {thang, nam} = state.meta;
  const loaiOptions = state.bb.map(b=>b.loai);

    return `
    <tr>
      <td data-label="Ngày"><input type="date" class="txt" data-array="ct" data-id="${r.id}" data-field="ngay" data-type="text" value="${r.ngay||''}"></td>

}

    <tr>
      <td class="num" data-label="Ngày"><input type="text" inputmode="numeric" data-array="vay" data-id="${r.id}" data-field="ngay" data-type="number" value="${r.ngay}" style="max-width:70px"></td>
      <td class="num" data-label="Tháng"><input type="text" inputmode="numeric" data-array="vay" data-id="${r.id}" data-field="thang" data-type="number" value="${r.thang}" style="max-width:70px"></td>
      <td class="num" data-label="Năm"><input type="text" inputmode="numeric" data-array="vay" data-id="${r.id}" data-field="nam" data-type="number" value="${r.nam}" style="max-width:80px"></td>
      <td data-label="Tên khoản vay"><input type="text" class="txt" data-array="vay" data-id="${r.id}" data-field="ten" data-type="text" value="${esc(r.ten)}"></td>
      <td class="num" data-label="Số tiền"><input type="text" inputmode="numeric" data-array="vay" data-id="${r.id}" data-field="soTien" data-type="money" value="${formatNumberPlain(r.soTien)}"></td>
      <td data-label="Ghi chú"><input type="text" class="txt" data-array="vay" data-id="${r.id}" data-field="ghiChu" data-type="text" value="${esc(r.ghiChu||'')}"></td>
      <td class="center" data-label="Đã hoàn thành"><input type="checkbox" data-array="vay" data-id="${r.id}" data-field="daHoanThanh" data-type="checkbox" ${r.daHoanThanh?'checked':''}></td>
      <td class="center" data-label="Xoá"><button class="btn-icon" data-action="delete" data-array="vay" data-id="${r.id}" title="Xoá">✕</button></td>
    </tr>
  `).join('') : `<tr><td colspan="8" class="empty-state">Chưa có khoản vay nào.</td></tr>`;

  const addForm = `
    <form class="add-form" data-add="vay">
      <input type="text" inputmode="numeric" name="ngay" placeholder="Ngày" style="max-width:70px" required>
      <input type="text" inputmode="numeric" name="thang" placeholder="Tháng" style="max-width:70px" value="${state.meta.thang}" required>
      <input type="text" inputmode="numeric" name="nam" placeholder="Năm" style="max-width:90px" value="${state.meta.nam}" required>
      <input type="text" name="ten" placeholder="Tên khoản vay" required>
      <input type="text" inputmode="numeric" data-type="money" name="soTien" placeholder="Số tiền" required>
      <input type="text" name="ghiChu" placeholder="Ghi chú">
      <button type="submit">+ Thêm khoản vay</button>
    </form>`;

  return `
  <div class="section-title">Khoản vay</div>
  <p class="section-sub">Các khoản bạn vay người khác/tổ chức — không tự reset theo tháng, chỉ mất khi tick "Đã hoàn thành".</p>

  ${wrapAddForm('vay', 'Thêm khoản vay', addForm)}

  <div class="table-scroll">
    <table>
      <thead><tr><th>Ngày</th><th>Tháng</th><th>Năm</th><th>Tên khoản vay</th><th class="num">Số tiền</th><th>Ghi chú</th><th class="center">Đã hoàn thành</th><th class="center">Xoá</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
  </div>

  <div class="summary-row">
    <div class="summary-chip">Tổng còn nợ vay<b>${fmt(outstanding)}</b></div>
  </div>
  `;
}

/* ==========================================================
   VIEW: Dữ liệu (Import/Export/Reset)
   ========================================================== */
function viewData(){
  return `
  <div class="section-title">Dữ liệu</div>
  <p class="section-sub">Toàn bộ dữ liệu chỉ nằm trong trình duyệt này. Tải xuống JSON thường xuyên để không mất dữ liệu khi xoá cache/đổi máy.</p>

  <div class="panel">
    <h3 style="margin-bottom:14px;">Sao lưu</h3>
    <p class="hint">Tải toàn bộ dữ liệu (Tổng quan, Chi tiêu, Ngân sách, Cho vay, Chờ thu, Dư nợ, Vay) thành một file JSON.</p>
    <button class="btn primary" id="btnExport">↓ Tải xuống JSON</button>
  </div>

  <div class="panel">
    <h3 style="margin-bottom:14px;">Khôi phục</h3>
    <p class="hint">Chọn file JSON đã tải xuống trước đó để khôi phục — sẽ ghi đè toàn bộ dữ liệu hiện tại.</p>
    <input type="file" id="fileImport" accept="application/json">
  </div>

  <div class="panel">
    <h3 style="margin-bottom:14px;">Xoá toàn bộ dữ liệu</h3>
    <p class="hint">Đưa sổ về trạng thái trống hoàn toàn. Không thể hoàn tác — hãy tải xuống JSON trước nếu cần.</p>
    <button class="btn danger" id="btnReset">Xoá toàn bộ dữ liệu</button>
  </div>
  `;
}

/* ==========================================================
   NORMALIZE NEW ROW (add-form submit)
   ========================================================== */
function normalizeNewRow(arrName, obj){
  switch(arrName){
    case 'ct':
      obj.soTien = parseMoney(obj.soTien);
      break;
    case 'bb':
      obj.donGia = parseMoney(obj.donGia);
      obj.soBuoiCoDinh = parseInt(obj.soBuoiCoDinh,10) || 0;
      break;
    case 'chovay':
      obj.soTien = parseMoney(obj.soTien);
      obj.daThu = false;
      break;
    case 'chotra':
      obj.soTien = parseMoney(obj.soTien);
      obj.daNhan = false;
      break;
    case 'duno':
    case 'vay':
      obj.soTien = parseMoney(obj.soTien);
      obj.ngay = parseInt(obj.ngay,10) || 1;
      obj.thang = parseInt(obj.thang,10) || state.meta.thang;
      obj.nam = parseInt(obj.nam,10) || state.meta.nam;
      obj.daHoanThanh = false;
      break;
  }
}

/* ==========================================================
   QUICK-ADD (nút + nổi thêm chi tiêu nhanh)
   ========================================================== */
function fillQuickAddLoaiOptions(){
  const sel = document.getElementById('qaLoai');
  const loaiOptions = state.bb.map(b=>b.loai);
  sel.innerHTML = loaiOptions.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
}
function openQuickAdd(){
  fillQuickAddLoaiOptions();
  document.getElementById('qaSoTien').value = '';
  document.getElementById('qaChiTiet').value = '';
  document.getElementById('qaNgay').value = todayStr();
  document.getElementById('quickAddOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(()=>{ document.getElementById('qaSoTien').focus(); }, 50);
}
function closeQuickAdd(){
  document.getElementById('quickAddOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ==========================================================
   BACK TO TOP (nút về đầu trang)
   ========================================================== */
const fabTop = document.getElementById('fabTop');
function updateFabTop(){
  if(window.scrollY > 320) fabTop.classList.add('show');
  else fabTop.classList.remove('show');
}
window.addEventListener('scroll', updateFabTop, {passive:true});
fabTop.addEventListener('click', ()=>{
  window.scrollTo({top:0, behavior:'smooth'});
});
updateFabTop();

document.getElementById('fabAdd').addEventListener('click', openQuickAdd);
document.getElementById('quickAddClose').addEventListener('click', closeQuickAdd);
document.getElementById('quickAddOverlay').addEventListener('click', e=>{
  if(e.target.id==='quickAddOverlay') closeQuickAdd();
});
document.getElementById('quickAddForm').addEventListener('submit', e=>{
  e.preventDefault();
  const obj = {
    id: uid(),
    ngay: document.getElementById('qaNgay').value || todayStr(),
    chiTiet: document.getElementById('qaChiTiet').value.trim(),
    soTien: parseMoney(document.getElementById('qaSoTien').value),
    loai: document.getElementById('qaLoai').value,
  };
  if(!obj.chiTiet || !obj.soTien){ return; }
  state.ct.push(obj);
  saveState();
  closeQuickAdd();
  renderAll();
});

/* ==========================================================
   EVENT DELEGATION
   ========================================================== */
document.addEventListener('click', e=>{
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ state.ui.currentTab = tabBtn.dataset.tab; saveState(); renderAll(); window.scrollTo({top:0}); return; }

  const toggleBtn = e.target.closest('[data-toggle-add]');
  if(toggleBtn){
    const key = toggleBtn.dataset.toggleAdd;
    addOpen[key] = !addOpen[key];
    const wrap = document.querySelector(`[data-add-wrap="${key}"]`);
    if(wrap){
      wrap.classList.toggle('open', addOpen[key]);
      toggleBtn.classList.toggle('open', addOpen[key]);
      if(addOpen[key]){
        const firstField = wrap.querySelector('input, select');
        if(firstField) setTimeout(()=>firstField.focus(), 180);
      }
    }
    return;
  }

  const delBtn = e.target.closest('[data-action="delete"]');
  if(delBtn){
    const arrName = delBtn.dataset.array, id = delBtn.dataset.id;
    if(confirm('Xoá dòng này?')){
      state[arrName] = state[arrName].filter(r=>r.id!==id);
      saveState(); renderAll();
    }
    return;
  }

  // Điều hướng tháng ở Tổng quan
  if(e.target.id==='tccnPrevMonth' || e.target.closest && e.target.closest('#tccnPrevMonth')){
    const curThang = state.meta.thang, curNam = state.meta.nam;
    const viewThang = state.ui.tccnViewThang ?? curThang;
    const viewNam = state.ui.tccnViewNam ?? curNam;
    const prev = addMonths(viewThang, viewNam, -1);
    state.ui.tccnViewThang = prev.thang; state.ui.tccnViewNam = prev.nam;
    saveState(); renderAll(); return;
  }
  if(e.target.id==='tccnNextMonth' || e.target.closest && e.target.closest('#tccnNextMonth')){
    const curThang = state.meta.thang, curNam = state.meta.nam;
    const viewThang = state.ui.tccnViewThang ?? curThang;
    const viewNam = state.ui.tccnViewNam ?? curNam;
    const next = addMonths(viewThang, viewNam, 1);
    state.ui.tccnViewThang = next.thang; state.ui.tccnViewNam = next.nam;
    saveState(); renderAll(); return;
  }
  if(e.target.id==='tccnTodayMonth' || e.target.closest && e.target.closest('#tccnTodayMonth')){
    state.ui.tccnViewThang = null; state.ui.tccnViewNam = null;
    saveState(); renderAll(); return;
  }

  if(e.target.id==='btnExport'){
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const dd = now.getDate();
    const mm = now.getMonth()+1;
    const yyyy = now.getFullYear();
    const hh = String(now.getHours()).padStart(2,'0');
    const mi = String(now.getMinutes()).padStart(2,'0');
    // Lưu ý: trình duyệt sẽ tự đổi "/" và ":" thành "_" khi lưu file (ký tự này không hợp lệ trong tên file).
    const fileName = `DATATC-${dd}/${mm}/${yyyy} ${hh}:${mi}.json`;
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return;
  }

  if(e.target.id==='btnReset'){
    if(confirm('Xoá TOÀN BỘ dữ liệu? Hành động này không thể hoàn tác.')){
      state = defaultState();
      saveState(); renderAll();
    }
    return;
  }
});

/* Định dạng số tiền có dấu phẩy ngay khi đang gõ (mọi ô có data-type="money")
   Giữ đúng vị trí con trỏ theo số chữ số đã gõ trước đó, thay vì luôn đẩy về cuối —
   đây chính là nguyên nhân khiến việc sửa một số tiền có sẵn (VD: Ngân sách) rất khó
   thực hiện trước đây (mỗi lần gõ, con trỏ bị bật ngược về cuối ô). */
document.addEventListener('input', e=>{
  const el = e.target;
  if(el.matches && el.matches('[data-type="money"]')){
    const raw = el.value;
    const caret = el.selectionStart == null ? raw.length : el.selectionStart;
    const digitsBeforeCaret = raw.slice(0, caret).replace(/[^0-9]/g,'').length;
    const digits = raw.replace(/[^0-9]/g,'');
    const num = digits ? parseInt(digits,10) : 0;
    const formatted = digits ? formatNumberPlain(num) : '';
    el.value = formatted;
    let pos = 0, seen = 0;
    while(pos < formatted.length && seen < digitsBeforeCaret){
      if(/[0-9]/.test(formatted[pos])) seen++;
      pos++;
    }
    el.setSelectionRange(pos, pos);
  }
});

/* Bấm vào ô tiền là chọn hết nội dung sẵn có, để gõ số mới là thay thế luôn — đỡ phải xoá tay */
document.addEventListener('focusin', e=>{
  const el = e.target;
  if(el.matches && el.matches('[data-type="money"]')){
    setTimeout(()=>{ try{ el.select(); }catch(err){} }, 0);
  }
});

document.addEventListener('change', e=>{
  const el = e.target;

  // Toggle lọc CT theo tháng
  if(el.id==='ctFilterToggle'){
    state.ui.ctChiThangNay = el.checked;
    saveState(); renderAll(); return;
  }

  // Xem dư nợ tháng khác
  if(el.id==='duNoThangInput' || el.id==='duNoNamInput'){
    const t = document.getElementById('duNoThangInput');
    const n = document.getElementById('duNoNamInput');
    state.ui.duNoThangKhac = parseInt(t.value,10) || state.meta.thang;
    state.ui.duNoNamKhac = parseInt(n.value,10) || state.meta.nam;
    saveState(); renderAll(); return;
  }

  // Import file
  if(el.id==='fileImport'){
    const file = el.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = evt=>{
      try{
        const parsed = JSON.parse(evt.target.result);
        if(!parsed || typeof parsed!=='object' || !parsed.meta){
          alert('File JSON không đúng định dạng của Sổ Chi Tiêu.');
          return;
        }
        if(confirm('Khôi phục sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại. Tiếp tục?')){
          parsed.ui = parsed.ui || { currentTab:'tccn', ctChiThangNay:false, duNoThangKhac:null, duNoNamKhac:null, tccnViewThang:null, tccnViewNam:null };
          state = parsed;
          saveState(); renderAll();
        }
      }catch(err){
        alert('Không đọc được file JSON: '+err.message);
      }
    };
    reader.readAsText(file);
    return;
  }

  // Meta fields (Tổng quan settings)
  if(el.dataset && el.dataset.meta){
    const field = el.dataset.meta, type = el.dataset.type || 'text';
    let val;
    if(type==='money'){ val = parseMoney(el.value); el.value = formatNumberPlain(val); }
    else if(type==='number'){ val = parseInt(el.value,10) || 0; }
    else { val = el.value; }
    state.meta[field] = val;
    saveState(); renderAll(); return;
  }

  // Table cell edits
  if(el.dataset && el.dataset.array){
    const arrName = el.dataset.array, id = el.dataset.id, field = el.dataset.field, type = el.dataset.type || 'text';
    const row = state[arrName].find(r=>r.id===id);
    if(!row) return;
    let val;
    if(type==='money'){ val = parseMoney(el.value); }
    else if(type==='number'){ val = parseInt(String(el.value).replace(/[^0-9-]/g,''),10) || 0; }
    else if(type==='checkbox'){ val = el.checked; }
    else { val = el.value; }
    row[field] = val;
    saveState(); renderAll(); return;
  }
});

document.addEventListener('submit', e=>{
  const form = e.target.closest('form[data-add]');
  if(!form) return;
  e.preventDefault();
  const arrName = form.dataset.add;
  const fd = new FormData(form);
  const obj = { id: uid() };
  for(const [k,v] of fd.entries()) obj[k] = v;
  normalizeNewRow(arrName, obj);
  state[arrName].push(obj);
  saveState();
  addOpen[arrName] = false;
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ==========================================================
   INIT
   ========================================================== */
renderAll();
</script>
</body>
</html>
